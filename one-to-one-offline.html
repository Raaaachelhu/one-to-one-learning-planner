初中:{
语文:[['字词与古诗文','结合语境辨析音形义；默写要同时检查字形、句序和上下句对应；文言实词先用课内义项迁移，再联系语境。','字形混淆、主语省略误译、只背译文不理解原句。','分清通假、古今异义与一词多义；翻译时补足省略成分，保留专有名词。','选一段课内文言文逐句解释，圈出3个迁移义项，再做一段课外短文。'],['现代文阅读','先辨文体，再建立段落结构；信息题回到原文定位，概括题使用对象＋事件／特点，赏析题说明表达效果。','只贴术语不结合原句；概括遗漏限制条件；把个人看法当作文本结论。','记叙文看人物与线索，说明文看对象与特征，议论文看论点、论据与论证。','限时阅读一篇文章，为每个答案标出原文证据，逐条对照参考要点。'],['整本书与综合学习','人物、情节、主题与阅读体验互证；综合学习注意材料之间的一致、补充和冲突。','只记名著人物标签，不能用具体情节证明。','建立人物关系图，用一个关键事件解释人物的变化。','用150字写一则人物评价，必须包含两处具体情节。'],['写作与表达','审清对象、范围和文体；用具体细节支撑中心，段落之间保持因果或递进。','套作偏题、叙事平均用力、细节空泛、结尾生硬拔高。','先列中心句与三段结构，再围绕转折或冲突补充动作、语言和感受。','完成提纲与一个细节段；用切题、结构、内容、语言四项互评。']],
数学:[['数与式、方程与不等式','整式运算遵守运算律；分式先找分母不为0的条件；方程求解后检验；不等式乘负数要改变符号。','去括号漏变号；分式方程漏验根；把不等式解集当作单个值。','先明确取值范围，再同解变形；含参数时按临界条件讨论。','先算2道分式运算，再解2道方程并验根，最后完成一道不等式组。'],['函数与图像','一次函数看斜率与截距；反比例函数看比例系数与象限；二次函数用顶点、对称轴和零点联系图像。','图像平移符号混淆；不检查自变量范围；忽略实际情境边界。','二次函数顶点横坐标为−b/(2a)，根的判别式为b²−4ac；数形结合验证。','给定三点求二次函数解析式，再限制区间讨论最大、最小值。'],['图形与几何','从题设提取平行、垂直、等长、角关系；全等与相似先找对应；圆中关注弦、弧、角的对应关系。','相似对应写错；把图上看似成立当成已知；辅助线缺少目的。','证明链写成已知→定理条件→结论；锐角三角函数用直角三角形建立比例。','完成一题相似三角形证明和一题圆的综合；逐步写明推理依据。'],['统计、概率与应用建模','均值、中位数、众数回答不同问题；概率用等可能样本空间计算；建模经历设未知量、列关系、求解与解释。','把百分比直接相加；平均数代表性判断缺少离散情况；样本空间漏列。','概率＝有利结果数／等可能结果总数；用树状图或列表检查完整性。','列出两次抽取的所有可能结果；解释一组数据为何使用中位数。']],
英语:[['词汇、语法与语境','以语块记词义，时态看时间线和语境，非谓语与从句先判断句子结构。','只背中文义不看搭配；主谓一致错误；句子缺谓语。','先找主语与谓语，再判断修饰和连接关系；词形变化需同时符合语义和语法。','用10个高频词各写一个情境句，标注词性、搭配与时态。'],['阅读与信息定位','区分事实、推断和观点；定位同义替换，推断需要文本证据；篇章主旨结合首尾与段落中心。','关键词一出现就选；推断超过文本范围；混淆代词指代。','先读题干圈限定词，返回段落建立证据，再比较选项范围。','限时做一篇阅读，给每个选项写出支持或排除的证据。'],['听说与综合运用','听前预测人物、地点、时间；听中记录数字和转折；口语优先保证信息完整和表达清楚。','数字与单位漏记；只听单词不听关系；背模板答非所问。','用关键词而非完整句速记；复述以谁、何时、何地、发生什么组织。','听一段1分钟材料，复述核心信息后对照原文补充遗漏。'],['写作与任务表达','审清人称、时态、要点和语域；段落承担明确功能，连接词体现真实关系。','漏要点、代词指代不清、长句堆砌、基础拼写反复错。','用内容完整、结构清晰、语言准确、交际得体四项自查。','写80—100词短文（具体字数以题目为准），标出要点并完成一次修订。']],
物理:[['力、运动与机械','区分物体受力与运动状态；压强p＝F/S；密度ρ＝m/V；杠杆平衡先找力臂。','把惯性当作力；不做受力分析直接套公式；面积单位换算错。','画受力图并明确研究对象；浮力可用F浮＝ρ液gV排，核实适用条件。','分析静止在斜面上的物体，写出所受各力及方向。'],['电路与电功率','识别串并联连接关系，欧姆定律I＝U/R；电功率P＝UI，先判断电表测量对象。','电路变化时错误假设电流不变；混用额定与实际功率。','分清电源量、支路量、元件量；用极端情况检查变化方向。','画出串联电路，改变滑动变阻器后分析电流、电压和功率变化。'],['声、光、热与能量','光路作图依据反射、折射规律；比热容计算Q＝cmΔt；能量转化需明确起点与终点。','把反射与折射方向混淆；温度差与温度混用；热量与内能混同。','先画法线与光线方向，再确定角；物态变化结合吸放热解释。','画一组折射光路，并用分子运动观点解释温度变化。'],['实验与数据处理','区分控制变量、转换、等效替代等方法；数据记录要含单位，结论覆盖条件与变化关系。','实验结论只重复现象；测量结果有效位数不合适。','用自变量、因变量、控制量组织实验，图像斜率需联系物理意义。','为探究电流与电压关系写实验步骤、控制条件和异常数据处理。']],
化学:[['物质构成与化学用语','元素是同类核电荷数原子的总称；化学式体现元素组成及原子比例；方程式遵守质量守恒。','化合价与电荷符号混写；方程式不配平或漏条件。','先按反应事实写化学式，再配平并标注条件和状态。','写出水、氧化钙、氯化钠的化学式并解释含义。'],['常见气体、金属与溶液','从性质推用途；制气装置依据反应物状态和条件，收集方式依据密度、溶解性及反应性。','用气味判断气体；溶解度与溶质质量分数混淆。','溶质质量分数＝溶质质量／溶液质量；饱和状态要说明温度。','设计氧气的制取和检验流程，列出安全操作顺序。'],['酸碱盐与反应规律','酸碱盐辨析基于组成与性质；复分解反应注意生成沉淀、气体或水等条件。','看化学式直接判定溶液酸碱性；反应判断忽略溶解性。','除杂要不引入新杂质、不损失主要物质，并便于分离。','为氯化钠溶液中的碳酸钠杂质设计除杂步骤并说明理由。'],['实验探究与定量计算','提出假设、设计对照、观察证据、得出结论；计算从方程式中的质量比出发。','把实验现象写成结论；未排除其他可能原因。','明确已知纯物质质量，按比例求解，最后检查单位与实际意义。','根据一种反应物质量计算生成气体质量，写完整计算过程。']],
生物:[['细胞与生命活动','细胞结构与功能相适应；动植物细胞结构有异同；显微镜操作关注观察方向、放大倍数与光线。','把所有细胞都视为有细胞核；放大倍数相加。','总放大倍数为目镜与物镜放大倍数的乘积，成像方向结合装片移动验证。','画植物细胞并标明结构，说明两种结构的作用。'],['生物体与稳态健康','植物光合、呼吸与蒸腾联系环境；人体消化、呼吸、循环、排泄构成物质运输系统。','光合作用与呼吸作用混淆；把动脉等同于动脉血。','先说明发生部位、所需条件与产物，再建立系统之间的联系。','用流程图描述氧气从空气进入组织细胞的路径。'],['遗传、变异与进化','基因、染色体与性状存在层次关系；变异有多种来源；自然选择作用于种群中的差异。','显性等于常见或优良；个体为了适应主动产生变异。','先明确亲本可能基因型，再通过配子组合分析子代。','用简单遗传图解说明隐性性状可能在子代出现的原因。'],['生态与探究实践','生态系统包含生物与非生物环境；食物链体现捕食关系；实验关注单一变量和重复。','食物链加入阳光或分解者；样本过少就推广结论。','调查取样要有代表性，结论要与实验处理和数据一致。','设计光对植物生长影响的对照实验，说明控制变量。']],
历史:[['中国古代史','按时间梳理朝代更替、制度变化、经济发展和思想文化；认识统一多民族国家的形成与发展。','只背年代不清因果；把不同朝代制度混淆。','用时间、空间、背景、措施、影响组织事件，区别史实与解释。','为一项制度写形成背景与影响，用两条材料作证。'],['中国近现代史','围绕民族危机、救亡探索、革命建设与改革发展形成时间轴；联系国内外背景分析变化。','把相邻事件的目标与结果互换；忽略历史条件。','同主题事件按背景、主体、道路、影响对比，避免用今天标准简单评价。','对比两次近代探索，写出一项相同点与两项差异。'],['世界历史','以文明发展、资本主义发展、国际秩序变化及全球联系为线索；关注不同地区的互动。','只看欧洲事件；混淆战争导火索与根本原因。','放进同一时期的世界背景，用多因素解释历史进程。','建立一条世界近代发展时间轴并标出与中国历史的关联。'],['材料解读与论证','提取作者、时间、立场与核心信息，结合所学回答；小论题需要论点、史实和逻辑。','整段照抄、论点过宽、材料与论点脱节。','每条史实之后补一句说明其如何支持论点。','读两则不同立场史料，区分共同事实和不同解释。']],
地理:[['地图、地球与运动','经纬网用于定位，等高线反映地形；地球自转与公转对应不同地理现象。','经纬度方向颠倒；比例尺大小与范围关系弄反。','先读图名、图例、方向、比例尺；经纬度与半球判断逐项验证。','读等高线图判断山脊、山谷和坡度，标出依据。'],['世界与中国区域','用位置、地形、气候、河流、人口与产业建立区域画像；解释自然与人文联系。','背结论不看地图；气候类型与气候特征混为一谈。','定位后按要素说明，比较题使用同一指标逐项比较。','比较两地区的气候与农业差异，各写一条因果链。'],['资源、环境与发展','自然资源利用要兼顾效率、公平和可持续；分析人口、交通、产业的空间组织。','措施脱离当地条件；把资源丰富直接等同经济发达。','从问题的原因提出可执行措施，并讨论可能代价。','分析一地水资源紧张的自然与人文原因并提出两项措施。'],['图表与综合实践','从气温降水图、统计图和地图提取数值、趋势与空间差异；解释需回到图中证据。','漏读单位和时间；只描述现象不说明原因。','用时空定位→提取信息→因果解释→评价建议组织答案。','读一组气候图，用具体月份和降水数据证明判断。']],
道德与法治:[['成长、生命与责任','认识自我、调节情绪、珍爱生命；在家庭、学校与社会中理解责任和规则。','只说大道理，不联系具体情境和行动。','用观点、情境事实、具体行动组织回答。','分析一次同伴冲突，写出双方权利与合理沟通步骤。'],['权利、义务与法治','宪法具有根本法地位；权利与义务相统一；运用法律维护权益需遵循合法程序。','把道德要求都当成法律义务；维权方式侵犯他人权利。','先判断主体及行为，再联系规则，最后提出合法解决路径。','针对网络侵权案例列出证据保存与求助途径。'],['国家、社会与发展','联系国家制度、民主参与、文化认同与发展实践，理解个人与社会的关系。','材料关键词与观点机械匹配；观点过时或表述绝对。','以现行教材和当年要求为准，区分事实陈述与价值判断。','用一项公共生活实例说明公民如何有序参与。'],['情境辨析与开放题','辨析题先明确判断，再分层说明成立条件与局限；建议题对应问题、主体和动作。','一律肯定或否定；建议没有执行主体。','观点＋材料依据＋条件限制＋行动建议，避免口号化。','将一则时事材料提炼为问题、原因和建议三栏。']]
},
高中:{
语文:[['现代文阅读与信息论证','分析信息之间的条件、范围和因果；论述性材料关注论点、证据与推理，文学文本关注叙述与审美。','用局部信息替代整体；混淆必要和充分条件；赏析脱离语境。','先还原段落功能，再核验选项的主体、程度、范围与逻辑。','选择一篇双文本阅读，画论证结构并对两则材料作比较。'],['古诗文与文化积累','文言阅读依托实词、虚词、句式与语境；诗歌理解说话者、意象、情境和情感变化。','套用固定情感；翻译遗漏关键谓语与逻辑关系。','译句先直译关键字，再调整语序；诗歌分析用字词与结构证据支撑。','翻译两句含省略和倒装的句子，标出每处得分依据。'],['语言文字运用','辨析词语、病句与衔接；压缩、扩展、图文转换关注对象、层次、语体和信息完整。','修改病句只看单句；压缩遗漏核心要素。','先审交际任务和字数，再组织信息并检查语法结构。','完成一则新闻压缩与一处语段衔接，解释取舍。'],['任务驱动写作','把材料关系转化为可论证问题；论点明确，证据具体，兼顾反面或边界条件。','只引用名言不分析；忽视写作身份和受众；概念偷换。','界定概念→提出论点→分层论证→回应局限；材料是论证起点。','写一份800字议论文提纲和一段含反驳的论证段。']],
数学:[['函数、导数与不等式','定义域先行；函数性质与图像互证；导数f′(x)刻画局部变化，用符号表判断单调区间。','忽略参数分界；把f′(x)＝0等同极值；对数底数条件漏写。','先求定义域与导数，再讨论临界点和端点；恒成立问题转化为最值需检验条件。','对含参数三次函数讨论单调性，写出参数分段的依据。'],['三角函数、向量与立体几何','三角恒等变换明确角的范围；向量运算结合几何意义；空间证明可用综合法或坐标法。','角度与弧度混用；线面角取错；法向量方向未核实。','正弦定理与余弦定理结合已知条件选用；建系先验证正交关系。','完成一道解三角形和一道空间角计算，并做范围检验。'],['解析几何与圆锥曲线','从几何条件建立方程；联立后用根与系数关系处理弦、面积和定点定值。','直线斜率不存在时漏讨论；代数变形引入无效解。','先讨论位置关系与判别式，再表达目标量并核验可行范围。','设直线与椭圆相交，利用弦中点条件求参数并验证相交。'],['概率、统计与计数','分步与分类原则不同；条件概率基于条件样本空间；随机变量分布列需概率和为1。','把互斥当独立；抽样偏差忽略；期望等同最可能取值。','P(A|B)＝P(A∩B)/P(B)，要求P(B)>0；独立性需要依据。','对一次抽样试验写分布列、期望，并说明模型假设。'],['数列、集合与逻辑','等差与等比的通项、求和联系递推；集合关系与量词范围需精确表达。','裂项或错位相减缺少首尾；否定命题时量词不变。','递推求通项先看结构；数学归纳法须完整证明初始情形和递推步骤（按学习范围使用）。','由递推式求通项并验算前三项，完成一个量词命题的否定。']],
英语:[['语篇阅读与推断','从篇章结构识别作者目的、态度与信息层级；长难句先拆主干再处理修饰。','依个人常识代替文本；把局部态度概括成全文态度。','对选项逐个检查主体、范围、程度、时间和因果。','限时完成两篇阅读，对推断题各写一句证据链。'],['语言运用与词汇语法','完形联系局部搭配与全篇逻辑；语法填空先判断句法位置与语义关系。','近义词只按中文选；从句和非谓语判断混乱。','有提示词看词形、谓语和非谓语，无提示词看结构与逻辑连接。','整理一篇语法填空，按谓语、非谓语、词性和连接成分归类。'],['应用文写作','根据信息任务确定语域、结构与关键要点，准确表达目的、安排和请求。','句型华丽但信息不全；套话挤占核心内容。','写前列三项要点，写后检查时间地点、逻辑、称呼与收尾。','按题目要求完成邀请或建议信，核对每条信息。'],['读后续写与综合表达','先理解人物、冲突、情节与情感线；续写呼应给定段首和原文伏笔。','人物动机突变；续写引入无法收束的新冲突；上下段断裂。','按原文证据设计两段的起承转合，动作和心理描写服务情节。','绘制故事线与情感线，再写一个与段首紧密衔接的情节段。'],['听力与口语任务','听清态度、转折、隐含建议与事实变化；口语组织需连贯并符合任务要求。','只记数字不记条件；忽略否定和转折后的真实意图。','听前预测，听中分层记录，听后用语境复核；地方听说考试按当地要求。','听两段对话，分别复述事实、态度与建议。']],
物理:[['力学与运动建模','选研究对象，画受力图，判断适用运动规律；牛顿第二定律以合力对应加速度。','把平均速度当瞬时速度；多个过程套同一加速度。','F合＝ma；能量与动量方法分别检查系统边界、外力做功与冲量条件。','分析含摩擦的多过程运动，分段列式并检查连接速度。'],['电磁场与电路','场强、电势与能量联系带电粒子运动；电磁感应先判断磁通量变化和回路条件。','电势高等同电势能大；洛伦兹力误判做功；楞次定律方向错误。','E＝F/q、U＝W/q明确符号；磁场中圆周运动由洛伦兹力提供向心力。','画带电粒子轨迹，标速度与受力，再用能量解释速率变化。'],['振动波、光学与近代物理','区分介质质点运动与波的传播；几何光学作图结合规律；近代物理模型有适用条件。','波传播方向与质点运动方向混淆；光电效应仅用经典能量连续观点解释。','通过图像的时间或空间含义区分波形图与振动图；单位保持一致。','由波形图和周期求传播速度，标记一质点下一时刻的运动方向。'],['实验设计与误差','实验原理决定测量量、器材和数据处理；误差区分系统与偶然，图像法不能消除所有误差。','先选器材后想原理；只报结果不写不确定来源。','用关系式转化为线性图像，说明斜率、截距与待测量关系。','设计测电阻方案，比较内接外接引入的误差方向。']],
化学:[['物质结构与周期规律','从原子结构、化学键、分子结构到物质性质建立解释链；周期变化注意比较前提。','把分子极性等同于键极性；宏观性质仅凭一个因素判断。','先确定粒子结构和相互作用，再比较性质；例外需回到具体物质。','比较两种分子沸点，从分子间作用和结构给出解释。'],['反应原理与化学平衡','反应速率与平衡组成是不同问题；平衡移动解释受温度、浓度、压强及体系限制。','催化剂改变平衡常数；稀释效应不分体系。','平衡常数在给定反应中取决于温度；结合反应商判断方向。','用三段式计算平衡组成，再改变条件判断变化趋势。'],['电化学、离子反应与溶液','原电池和电解池判断电极反应与电子流；离子反应检查电荷、元素和氧化还原守恒。','阴阳极与正负极混用；忽略溶液中其他可反应离子。','先列可能发生的半反应，再依据条件确定反应；电荷守恒核验计算。','写一个电池的半反应、总反应，并标明离子迁移方向。'],['有机化学与实验探究','官能团决定主要反应类型；合成路线需考虑原料、条件、选择性和保护策略。','同分异构体漏算；操作顺序未考虑安全或副反应。','通过官能团变化反推反应路径，实验设计包含对照、检验与纯化。','为简单有机物设计两步转化路线，并说明每步条件。']],
生物:[['细胞代谢与实验','细胞结构支撑代谢，酶与ATP联系能量过程；光合与呼吸同时受多因素影响。','净光合与总光合混淆；实验变量和检测指标不对应。','先说明测量的是净值还是总值，控制条件并考虑细胞呼吸影响。','分析光照强度与净光合曲线，解释补偿点和饱和点。'],['遗传与进化','分离与自由组合定律均有适用前提；基因表达与调控联系性状；种群基因频率反映进化。','基因型比例直接当表型比例；不审查致死、伴性与连锁条件。','先确定遗传方式，再列配子、子代及概率；假设需用证据检验。','分析一个家系，列出所有可能遗传方式与排除证据。'],['稳态、调节与生态','神经、体液、免疫调节相互配合；生态系统关注能量流动、物质循环和信息传递。','负反馈只背定义不说明过程；把能量流动说成循环。','调节题写刺激、感受、调节和效应；生态题明确营养级与统计口径。','画血糖调节反馈图并说明一种异常状态的可能原因。'],['生物技术与探究论证','技术流程依赖材料、原理和条件；实验结论不得超出对照设计与数据支持范围。','把相关性当因果；实验组与对照组有多个同时改变因素。','提出可检验假设，选择合适指标，说明重复、对照和预期结果。','为一个基因功能假设设计对照实验，并讨论替代解释。']],
历史:[['中国通史与阶段特征','联系政治制度、经济结构、思想文化与社会生活理解历史阶段及转型。','把多个时代相似制度视为完全相同；阶段特征缺少证据。','从时间、空间和制度背景解读史实，认识发展延续与变化。','选两个时期，从政治经济文化三条线比较变化。'],['世界通史与全球联系','考察文明互动、近代转型、世界市场与国际秩序；区域发展需要放进全球背景。','以单一路径解释所有社会；将同时发生误判为因果。','采用多因素解释，区分直接原因、深层背景和历史影响。','解释一项世界格局变化，至少用三个维度的证据。'],['史料实证与历史解释','评估史料类型、形成时间、作者立场与目的；多种史料互证并说明局限。','一手史料等于完全真实；仅凭一则材料作普遍判断。','先识别史料信息，再结合外部知识验证；论证需保留证据边界。','比较回忆录和统计资料的用途及局限，形成一个有条件结论。'],['开放性论题与专题整合','从材料提出可论证的论题，用史实形成逻辑连贯的解释，回应变化与连续性。','论题只是重复材料标题；例证堆砌没有解释。','论题清楚、史实准确、解释充分、结论回应，避免绝对化。','围绕技术与社会变迁提出论题，写两条史实与论证。']],
地理:[['自然地理过程','理解大气、水、地貌、土壤与植被的相互作用；过程分析注意空间尺度与时间尺度。','用静态结论解释动态过程；忽略热力与动力条件。','从能量、物质运动和环境条件构建因果链。','解释某地降水季节变化，区分水汽来源、抬升和环流条件。'],['人文地理与区域发展','人口、城镇、产业、交通区位受多因素影响且会变化；评价兼顾不同主体。','罗列所有区位因素不分主次；优势与发展措施混写。','结合材料找限制条件，按自然、经济、社会与政策组织。','比较两地产业选址，给出主导因素、限制因素和调整建议。'],['资源、环境与可持续','环境问题分析成因、影响与治理，资源安全联系供需、贸易和技术。','治理方案只有口号；忽略措施成本与区域差异。','从源头、过程、末端及协同管理提出对应措施。','分析一地水资源安全，分别给出供给、需求和生态措施。'],['图表判读与综合推理','空间图、统计图与示意图整合信息；推理中区分图中事实、已知原理与假设。','比例与总量混同；忽略图例变化；循环论证。','先描述可观察证据，再提出解释并核对其他材料。','根据两幅不同时期土地利用图，分析变化和潜在环境影响。']],
思想政治:[['经济与社会','从生产、分配、交换、消费联系分析经济生活；政策解释需要明确主体与传导机制。','将政策目标当成已发生效果；主体权责混淆。','材料事实→教材原理→作用机制→条件限制，避免标签式答题。','对一项就业政策画传导链，指出两类受益主体。'],['政治与法治','理解国家制度、党的领导、人民当家作主与依法治国的统一；辨清国家机关职责。','把不同机关权力混同；法律概念用生活语言随意替代。','先确定主体、行为、权限，再结合制度与程序解释。','分析一项公共决策过程，逐步对应参与主体与程序。'],['哲学与文化','运用联系、发展和矛盾分析方法；文化发展联系传承、创新和社会实践。','只背观点，不说明材料如何体现；把任何变化都说成发展。','原理表述准确，用材料中的具体关系作论据，并写方法论。','对一项文化创新案例写原理、材料对应与启示。'],['逻辑、法律与国际专题','根据所学选择性必修内容辨析推理、民事权利、国际关系等，注重具体条件。','把形式正确当结论必真；法律分析忽略构成要件。','明确适用知识范围，逐条件检验，避免跨概念套用。','针对一则合同案例列主体、行为、争议与证据。']]
},
小学:{
语文:[['识字写字与语言积累','字形、字音、字义在语境中学习；书写关注结构与规范，积累常用词句。','会认不会写；脱离语境死背词义。','先读准、理解再运用，通过句子检查是否会用。','挑5个易错字组词造句，并在次日听写。'],['阅读与整本书','从人物、事件、顺序与感受理解文本；高年级逐渐辨析表达效果和信息关系。','只读情节不找依据；回答过于笼统。','用谁、做了什么、结果怎样概括，用原文支持感受。','读一篇短文，用三句话概括并提出一个问题。'],['习作与口语表达','低年级写清一句话，中年级写清一件事，高年级围绕中心组织具体材料。','流水账；中心与细节不匹配。','先口头讲述，再写提纲，最后补充动作和感受。','围绕一次真实经历写一段，有时间、地点、人物与细节。']],
数学:[['数与运算','理解整数、小数、分数的意义与运算关系；估算用来检查结果数量级。','只记算法不理解算理；单位与进位混淆。','通过数轴、图形和实物解释运算，再练习规范计算。','用图解释分数加法，最后估算检验结果。'],['数量关系与应用','从情境中找已知量、未知量和关系，借助线段图、表格或方程解决。','见关键词就决定加减乘除；忽略问题对象。','先说清数量关系，再列式并用实际情境验算。','为一题行程或购物问题画线段图，写解题理由。'],['图形、几何与测量','认识平面与立体图形，理解周长、面积、体积及单位的区别。','周长面积公式混用；单位换算缺少维度。','用拼摆、展开或分割解释公式来源，再处理综合图形。','测量一个长方体盒子，计算并说明表面积与体积。'],['统计与概率初步','读懂统计表与图，比较数量、变化和分布；用可能性描述随机现象。','不读纵轴起点；把可能当必然。','先读标题、单位和刻度，再比较并说明判断依据。','记录一周阅读时间，制作条形图并提出一个结论。']],
英语:[['听说、词汇与自然拼读','将语音、词形、意义和语境联系；自然拼读帮助解码但不能覆盖所有不规则词。','只读字母名称；词会认但不会在句中使用。','听辨→模仿→拼读→情境运用，常见不规则词单独积累。','选择一组音形规律词，用图卡和短句复习。'],['阅读与基础语法','在短文中理解人物、地点和事件；语法服务真实意义表达。','逐词翻译导致理解断裂；只纠错不检查理解。','先理解大意，再定位信息，最后关注重复出现的语言结构。','读一则故事，按发生顺序排列四幅图并复述。'],['书写与交际任务','从词到句到小段落，围绕熟悉生活表达信息和需求。','照抄模板不改信息；句首大写与标点遗漏。','内容完整、句意清楚、书写可辨，再逐步提高准确性。','写4—6句自我介绍并用录音检查是否表达清楚。']],

function salesInvalid(){sales.result=null;sales.report=null;const box=document.querySelector('#callResult');if(box)box.innerHTML='<div class="call-empty"><span>↺</span><h3>信息已更新</h3><p>请重新生成，以当前信息分析和规划。</p></div>';salesUpdateSidebar()}
function salesUpdateSidebar(){document.querySelectorAll('[data-sales-page]').forEach(b=>b.classList.toggle('active',b.dataset.salesPage===page));const s=document.querySelector('#salesMode');if(s)s.textContent=sales.persist?'跟进记录 · 本机保存已开启':'会话模式 · 首通不自动保存'}
function salesSidebar(){return `<button class="sales-menu-toggle" aria-label="打开左侧导航" aria-expanded="false" onclick="document.body.classList.toggle('sales-menu-open');this.setAttribute('aria-expanded',String(document.body.classList.contains('sales-menu-open')))">☰</button><div class="sales-side-brand"><svg viewBox="0 0 42 42" fill="none"><circle cx="21" cy="21" r="18" stroke="currentColor"/><path d="m21 6 5 12 10 3-12 5-3 10-5-12-10-3 12-5Z" stroke="currentColor"/></svg><div><strong>伴学一对一</strong><small>CONSULTATION STUDIO</small></div></div><div class="sales-role">前端销售 · 学科一对一<span>把专业判断，放在沟通之前。</span></div><nav>${SALES_NAV.map((n,i)=>`<button data-sales-page="${n[0]}" onclick="go('${n[0]}')"><span>${String(i+1).padStart(2,'0')}</span>${n[1]}<i>↗</i></button>`).join('')}</nav><div class="sales-side-foot"><span id="salesMode">会话模式 · 首通不自动保存</span><small>KNOWLEDGE INTO CONVERSATION</small></div>`}
function callGradeOptions(g){return Object.entries(SALES_GRADES).map(([s,gs])=>`<optgroup label="${s}">${options(gs,g)}</optgroup>`).join('')}
function callSubjects(){return SUBJECTS[salesStage(sales.draft.grade)].filter(s=>!['音乐','美术','体育与健康','劳动','综合实践','信息科技','信息技术','通用技术'].includes(s))}
function callChange(field,value){sales.draft[field]=value;if(field==='grade')sales.draft.rows=sales.draft.rows.filter(r=>callSubjects().includes(r.subject));salesInvalid();if(field==='grade')renderCall()}
function callToggle(subject,on){if(on)sales.draft.rows.push({subject,score:'',max:''});else sales.draft.rows=sales.draft.rows.filter(r=>r.subject!==subject);salesInvalid();document.querySelector('#callScores').innerHTML=callScoreRows()}
function callScoreRows(){return sales.draft.rows.map((r,i)=>`<div class="call-score-row"><strong>${esc(r.subject)}</strong><label><span>分数 · 未知留空</span><input aria-label="${esc(r.subject)}分数" type="number" min="0" step="0.1" value="${esc(r.score)}" placeholder="待了解" oninput="sales.draft.rows[${i}].score=this.value;salesInvalid()"></label><span class="score-slash">/</span><label><span>满分 · 单独核对</span><input aria-label="${esc(r.subject)}满分" type="number" min="0.1" step="0.1" value="${esc(r.max)}" placeholder="待核对" oninput="sales.draft.rows[${i}].max=this.value;salesInvalid()"></label></div>`).join('')||'<p class="hint">请至少选择一门学科。</p>'}
function renderCall(){const d=sales.draft;$('#view').innerHTML=heading('01 / FIRST CALL','先聊清楚，再给出建议。','首通只录地区、年级、学科与成绩。姓名留到家长方案再填写。',`<button class="text-btn" onclick="callDemo()">试用三科示例 ↗</button>`)+`<div class="call-flow">${['记录情况','核对范围','补充追问','提出假设','验证方向','约定下一步'].map((x,i)=>`<span><small>0${i+1}</small>${x}</span>`).join('')}</div><div class="call-layout"><form class="panel call-form" onsubmit="generateCall(event)"><div class="micro">THE CONVERSATION STARTS HERE</div><h3>这通电话，先了解这些。</h3><div class="grid two"><label class="field">地区<select aria-label="首通地区" onchange="callChange('province',this.value)">${options(PROVINCES,d.province)}</select></label><label class="field">年级<select aria-label="首通年级" onchange="callChange('grade',this.value)">${callGradeOptions(d.grade)}</select></label></div><div class="field call-subject-label">需要了解的学科 <small>支持多选，各科独立记录</small></div><div class="call-subjects">${callSubjects().map(s=>`<label><input type="checkbox" aria-label="首通${s}" ${d.rows.some(r=>r.subject===s)?'checked':''} onchange="callToggle('${s}',this.checked)"><span>${s}</span></label>`).join('')}</div><div id="callScores">${callScoreRows()}</div><p id="callError" class="form-error" role="alert"></p><button class="btn call-submit" type="submit">生成首通沟通提纲 <span>↗</span></button><p class="hint">成绩未知可留空。系统整理沟通方向；具体薄弱项需要已学进度和实际作答验证。</p></form><div id="callResult">${sales.result?callResultHTML():'<div class="call-empty"><div class="call-empty-orbit">◌</div><div class="micro">LISTEN FIRST. UNDERSTAND NEXT.</div><h3>让下一句话，更有依据。</h3><p>录入已知信息后，查看多科成绩概览、<br>年级对应知识方向与可直接使用的追问。</p><div class="call-empty-tags"><span>年级知识</span><span>多科分析</span><span>家长话术</span></div></div>'}</div></div>`;salesUpdateSidebar()}
function validateCall(d){if(!PROVINCES.includes(d.province)||!Object.values(SALES_GRADES).flat().includes(d.grade))throw Error('请选择有效地区和年级。');if(!d.rows.length)throw Error('请至少选择一门学科。');if(new Set(d.rows.map(r=>r.subject)).size!==d.rows.length)throw Error('学科不能重复。');return d.rows.map(r=>{let score=r.score===''?null:Number(r.score),max=r.max===''?null:Number(r.max);if(score!==null&&(!Number.isFinite(score)||score<0))throw Error(r.subject+'分数须为非负数');if(max!==null&&(!Number.isFinite(max)||max<=0))throw Error(r.subject+'满分须大于0');if(score!==null&&max!==null&&score>max)throw Error(r.subject+'分数不能大于满分');return {...r,score,max}})}
function callCandidates(grade,subject){const entry=gradeKnowledge(grade,subject);if(entry)return entry.rows.map((r,i)=>({id:'grade-'+i,title:r.title,points:r.points.join('；'),rule:r.rule,example:r.example,error:r.error,task:r.practice,book:r.book,role:r.role,question:'孩子是否已经学过“'+r.title+'”？最近一题能否独立完成并解释依据？'}));return topics(salesStage(grade),subject).map((r,i)=>({id:'overview-'+i,title:r[0],points:r[1],rule:r[3],example:'请用一题已学范围内的新题，观察作答过程。',error:r[2],task:r[4],book:'学段能力框架 · 按实际教材核对',role:'候选方向',question:'学校目前学到哪里？这一部分做题时最常在哪一步需要提示？'}))}
function generateCall(e){e?.preventDefault();try{const rows=validateCall(sales.draft);sales.result={...structuredClone(sales.draft),stage:salesStage(sales.draft.grade),rows:rows.map(r=>({...r,picks:callCandidates(sales.draft.grade,r.subject).length?[0]:[],notes:'',status:'待核对',references:[],evidence:{}})),id:sales.draft.callId||uid(),date:TODAY};sales.draft.callId=sales.result.id;sales.report=null;$('#callError').textContent='';$('#callResult').innerHTML=callResultHTML();salesUpdateSidebar()}catch(e){$('#callError').textContent=e.message}}
function callScoreText(r){return r.score===null?(r.max===null?'成绩与满分待了解':'分数待了解 / 满分'+r.max):(r.max===null?r.score+'分 / 满分待核对':r.score+' / '+r.max)}
function callResultHTML(){const c=sales.result;if(!c)return '';return `<div class="call-summary panel"><div class="micro">YOUR FIRST-CALL BRIEF</div><h3>${esc(c.province)} · ${esc(c.grade)} · ${c.rows.length}科学情沟通</h3><div class="call-bars">${c.rows.map(r=>`<div><div><b>${esc(r.subject)}</b><span>${callScoreText(r)}</span></div><div class="call-bar"><i style="width:${r.score!==null&&r.max!==null?r.score/r.max*100:0}%"></i></div><small>${r.score!==null&&r.max!==null?'本次口述得分率 '+(r.score/r.max*100).toFixed(1)+'%':'信息待核对'}</small></div>`).join('')}</div><p class="hint">各科成绩独立呈现，不以不同试卷的得分率比较能力排名。口述总分不拆算为章节失分。</p><div class="actions">${button('复制全科沟通稿','copyCallBrief()','outline')}${button('生成家长方案',"go('parent')")}${button('加入销售跟进','addSalesLead()','outline')}</div></div>${c.rows.map((r,i)=>callSubjectHTML(r,i)).join('')}<div class="panel call-next"><div class="micro">CLOSE WITH A NEXT STEP</div><h3>把这次沟通，落到一个约定。</h3><p>“我们先核对已学范围和一份近期作答，再确定优先处理的内容。您方便什么时候一起看一下？看完后，再确认是否适合一对一和每周能投入多少时间。”</p></div>`}
function callSubjectHTML(r,i){const c=sales.result,pool=callCandidates(c.grade,r.subject),entry=gradeKnowledge(c.grade,r.subject);return `<article class="panel call-subject-analysis"><div class="call-subject-head"><div><span class="micro">${String(i+1).padStart(2,'0')} / ${esc(c.grade)} · ${esc(r.subject)}</span><h3>先验证哪些知识方向？</h3></div><button class="text-btn" onclick="openCallKnowledge(${i})">查看年级知识 ↗</button></div><p class="call-score-guide">${esc(callScoreGuide(r))}</p>${entry?.note?`<p class="note">${esc(entry.note)}</p>`:''}${!pool.length?'<p class="muted">本年级通常尚未独立开设本课程，不把其他年级内容判为当前薄弱。先核对学制、教材与学校安排。</p>':`<p class="hint">选择最多3个已学或待核对方向。默认首个单元仅作演示候选，可按实际进度更换。</p><div class="candidate-chips">${pool.map((k,j)=>`<label><input type="checkbox" ${r.picks.includes(j)?'checked':''} onchange="callPick(${i},${j},this)"><span>${esc(k.title)}</span></label>`).join('')}</div>${r.picks.map(j=>{const k=pool[j];return `<section class="call-knowledge"><div class="micro">${esc(k.book)} · ${esc(k.role)}</div><h4>${esc(k.title)}</h4><p><b>理解什么</b>${esc(k.points)}</p><p><b>下一句怎么问</b>${esc(k.question)}</p><details><summary>展开专业解释、例子与验证任务</summary><p><b>方法条件</b>${esc(k.rule)}</p><p><b>自编示例</b>${esc(k.example)}</p><p><b>可能的失分表现</b>${esc(k.error)}（待实际作答确认）</p><p><b>确认后的动作</b>${esc(k.task)}</p></details><div class="call-talk"><small>可以这样向家长解释</small><p>${esc(callTopicTalk(k))}</p></div></section>`}).join('')}<label class="field">进度与作答核对<select aria-label="${r.subject}核对状态" onchange="sales.result.rows[${i}].status=this.value;sales.report=null">${options(['待核对','已学，待作答验证','已有作答证据，需教师复核','未学，作为后续衔接'],r.status)}</select></label><label class="field" style="margin-top:12px">本次追问记录（可选）<textarea aria-label="${r.subject}追问记录" placeholder="记录已学章节、首次出错步骤、提示次数或家长原话…" oninput="sales.result.rows[${i}].notes=this.value;sales.report=null">${esc(r.notes)}</textarea></label>${referenceAttachments(r,i)}`}</article>`}
function callPick(i,j,input){const r=sales.result.rows[i];if(input.checked&&r.picks.length>=3){input.checked=false;return toast('每科最多3个方向，先聚焦再验证')}r.picks=input.checked?[...r.picks,j]:r.picks.filter(k=>k!==j);sales.report=null;$('#callResult').innerHTML=callResultHTML()}
function callTopicTalk(k){return `“先看孩子是否已经学过${k.title}。这一部分主要看${k.points}。我们可以从一道实际作答入手，区分概念、方法和执行上的卡点，再决定是否需要针对性讲解。确认后，${k.task.replace(/[。！!?？]+$/,'')}。随后用同要求的新题观察独立完成与解释依据的变化。”`}
function openCallKnowledge(i){const c=sales.result;knowledge.stage=c.stage;knowledge.grade=c.grade;knowledge.subject=c.rows[i].subject;knowledge.mode=c.stage==='小学'?'overview':'grade';knowledge.query='';go('knowledge')}
function callBriefText(){const c=sales.result;if(!c)return '';return `${c.province} · ${c.grade}｜首通沟通提纲\n信息来源：电话口述，范围与作答待核对。\n`+c.rows.map(r=>`${r.subject}：${callScoreText(r)}\n先问：这次是哪一类考试？学校目前学到哪里？能否提供一题独立作答及评分？\n核对状态：${r.status}\n${r.picks.map(j=>{const k=callCandidates(c.grade,r.subject)[j];return k.title+'：'+callTopicTalk(k)}).join('\n')}\n追问记录：${r.notes||'待补充'}${referenceText(r)}`).join('\n\n')+'\n下一步：约定核对材料和体验/测评时间，确认每周总时间与决策安排。未确认前不承诺固定提分、排名或录取。'}
async function salesCopy(text){try{await navigator.clipboard.writeText(text);toast('已复制')}catch(e){download(new Blob([text],{type:'text/plain;charset=utf-8'}),'沟通提纲.txt');toast('已下载文本')}}
function copyCallBrief(){if(sales.result)salesCopy(callBriefText())}
function callDemo(){sales.draft={province:'湖北',grade:'初三',rows:[{subject:'数学',score:'82',max:'120'},{subject:'英语',score:'91',max:'120'},{subject:'物理',score:'53',max:'70'}]};sales.report=null;renderCall();generateCall();toast('已载入虚构三科示例')}
function parentEmpty(){return heading('02 / PARENT PLAN','把沟通，整理成看得懂的安排。','先完成首通提纲，再填写姓名与全科每周总时间。')+`<div class="empty"><h3>还没有本次首通信息。</h3><p>地区、年级、各科成绩与知识候选方向，将一同带入方案。</p>${button('开始电话首通',"go('call')")}</div>`}
function budgetSplit(total,n){return Array.from({length:n},(_,i)=>Math.floor(total/n)+(i<total%n?1:0))}
function validBudget(total,values){return Number.isInteger(total)&&total>=15&&total<=1200&&values.every(v=>Number.isInteger(v)&&v>0)&&values.reduce((a,b)=>a+b,0)===total}
function renderParent(){const c=sales.result;if(!c){$('#view').innerHTML=parentEmpty();return}const previous=sales.report;$('#view').innerHTML=heading('02 / PARENT PLAN','让家长看见，接下来怎么学。','这里再填写姓名；每科共享同一份每周总时间，合计必须一致。')+`<div class="panel"><form onsubmit="generateParent(event)"><div class="grid three"><label class="field">孩子姓名 / 称呼<input id="parentName" required maxlength="40" value="${esc(previous?.name||'')}" oninput="invalidateParent()" placeholder="仅用于本次方案"></label><label class="field">全科每周总预算 · 分钟<input id="parentMinutes" type="number" min="15" max="1200" step="1" value="${previous?.minutes||180}" oninput="invalidateParent()"></label><label class="field">本阶段期待（可选）<input id="parentGoal" maxlength="180" value="${esc(previous?.goal||'')}" oninput="invalidateParent()" placeholder="例如：能独立解释解题过程"></label></div><div class="budget-heading"><h3>各科时间分配</h3><button type="button" class="text-btn" onclick="splitParentBudget()">按总预算均分 ↗</button></div><div class="grid three">${c.rows.map((r,i)=>`<label class="field">${esc(r.subject)} · 每周分钟<input type="number" data-budget min="1" step="1" value="${previous?.budgets[i]||budgetSplit(180,c.rows.length)[i]}" aria-label="${esc(r.subject)}每周分钟" oninput="invalidateParent()"></label>`).join('')}</div><p class="hint">这是全科学习时间建议，包含讲解、独立练习和复测；不等同已售课时或已确认教师课表。</p><p id="parentError" class="form-error" role="alert"></p><button class="btn">生成全科家长方案 ↗</button></form></div><div id="parentOutput">${previous?parentReportHTML(previous):''}</div>`}
function invalidateParent(){sales.report=null;const out=$('#parentOutput');if(out)out.innerHTML='<div class="note">方案条件已修改，请重新生成。</div>'}
function splitParentBudget(){const total=Number($('#parentMinutes').value);if(!Number.isInteger(total)||total<15||total>1200)return toast('总预算需为15—1200整数分钟');const values=budgetSplit(total,sales.result.rows.length);document.querySelectorAll('[data-budget]').forEach((x,i)=>x.value=values[i]);invalidateParent()}
function generateParent(e){e.preventDefault();const name=$('#parentName').value.trim(),minutes=Number($('#parentMinutes').value),budgets=[...document.querySelectorAll('[data-budget]')].map(x=>Number(x.value));if(!name)return $('#parentError').textContent='请填写孩子姓名或称呼。';if(!validBudget(minutes,budgets))return $('#parentError').textContent='各科需为正整数分钟，合计必须等于全科总预算（15—1200分钟）。';sales.report={name,minutes,budgets,goal:$('#parentGoal').value.trim(),date:TODAY,call:structuredClone(sales.result)};$('#parentError').textContent='';$('#parentOutput').innerHTML=parentReportHTML(sales.report);toast('已生成全科方案')}
function parentSections(report,index){const c=report.call,r=c.rows[index],ks=r.picks.map(j=>callCandidates(c.grade,r.subject)[j]);return [{title:'01 / 当前信息与边界',body:`${r.subject}：${callScoreText(r)}。来源为首通口述；核对状态：${r.status}。\n${r.notes||'实际作答与已学范围待核对。'}\n每周预算${report.budgets[index]}分钟，包含讲解、练习与复测。`},{title:'02 / 候选知识与验证',body:ks.length?ks.map(k=>`${k.title}｜${k.book} · ${k.role}\n理解：${k.points}\n自编示例：${k.example}\n确认后的练习：${k.task}`).join('\n\n'):(callCandidates(c.grade,r.subject).length?'尚未选定本阶段知识方向，先核对进度与实际作答后再确定。':'本年级暂无独立开课的常用新授单元，先核对学校安排。')},...(referenceText(r)?[{title:'学段沟通补充（按已学进度核对）',body:referenceText(r)}]:[]),{title:'03 / 四周安排',body:'第1周：确认已学范围，完成候选方向的新任务，记录正确性、提示次数与首次出错步骤。\n第2周：根据证据选择一个主要卡点，示范后独立练习。\n第3周：更换数据、材料或问法，检验能否迁移。\n第4周：同要求新任务复测，比较独立程度、错误类型和解释质量，调整下一阶段安排。'},{title:'04 / 观察进步',body:'观察独立完成、提示次数、用时与过程解释。只比较要求和难度可比的任务。知识点是候选方向，不能仅凭总分判为薄弱；阶段目标不构成固定提分、排名或录取保证。'}]}
function parentReportHTML(r,actions=true){return `${actions?`<div class="actions report-export">${button('下载全科 HTML','downloadParentHTML()','outline')}${r.call.rows.map((s,i)=>button(s.subject+' 4K长图',`exportParentPNG(${i})`,'outline')).join('')}${button('保存为跟进记录','addSalesLead()','outline')}${button('建立档案与时间建议',"archiveSalesCall('schedule')",'outline')}</div>`:''}<article class="parent-report"><div class="micro">PERSONAL LEARNING ROUTE</div><h2>${esc(r.name)}的初步学习方案</h2><p>${esc(r.call.province)} · ${esc(r.call.grade)} · ${r.date}</p><div class="parent-goal"><strong>${esc(r.goal||'先确认卡点，再建立能独立完成的学习路径。')}</strong><p>每周全科总预算 ${r.minutes} 分钟 · ${r.call.rows.map((s,i)=>esc(s.subject)+' '+r.budgets[i]+'分钟').join(' / ')}</p></div>${r.call.rows.map((s,i)=>`<section><h3>${String(i+1).padStart(2,'0')} / ${esc(s.subject)}</h3>${parentSections(r,i).map(t=>`<h4>${esc(t.title)}</h4><p>${esc(t.body).replaceAll('\n','<br>')}</p>`).join('')}</section>`).join('')}<footer>伴学一对一 · 初步学习支持材料，教学进度与课程安排需学校及任课教师确认。<br>developer Rachel Hu（Shumin）</footer></article>`}
function downloadParentHTML(){const r=sales.report;if(!r)return toast('请重新生成方案');const html='<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>初步学习方案</title><style>body{margin:0;background:#f3f5f0;color:#345346;font:16px/1.9 system-ui,sans-serif}.parent-report{max-width:960px;margin:35px auto;padding:45px;background:#fffefa;border:1px solid #dce4d8;border-radius:16px}h2{font-size:32px}h3{font-size:25px}h4{color:#6b8859}section{border-top:1px solid #dce4d8;margin-top:35px;padding-top:20px}.micro,footer{font-size:12px;color:#84957a}.parent-goal{padding:24px;background:#edf3e5}footer{margin-top:35px}@media(max-width:600px){.parent-report{margin:0;padding:24px}}</style>'+parentReportHTML(r,false)+'</html>';download(new Blob([html],{type:'text/html;charset=utf-8'}),'全科家长学习方案.html')}
function exportParentPNG(i){const r=sales.report;if(!r)return toast('请重新生成方案');longReport(r.name+' · '+r.call.rows[i].subject+'学习方案',`${r.call.grade} / ${r.call.province} / 每周${r.budgets[i]}分钟 / ${r.date}`,parentSections(r,i),'家长学习方案_'+r.call.rows[i].subject+'_4K')}
function addSalesLead(){if(!sales.result)return toast('请先生成首通信息');const c=sales.result;const existing=sales.leads.find(l=>l.call.id===c.id);if(existing){existing.call=structuredClone(c);existing.report=sales.report?structuredClone(sales.report):null;if(sales.report)existing.name=sales.report.name;existing.history.push({date:TODAY,text:'更新首通与方案内容'});salesSave();return toast('已更新这条跟进记录')}sales.leads.push({id:uid(),name:sales.report?.name||'未署名咨询 '+String(sales.leads.length+1).padStart(2,'0'),status:'待核对材料',next:'',note:'',call:structuredClone(c),report:sales.report?structuredClone(sales.report):null,created:TODAY,history:[{date:TODAY,text:'建立首通跟进记录'}]});salesSave();toast('已加入销售跟进；'+(sales.persist?'保存在本机':'当前会话有效'));salesUpdateSidebar()}
function renderFollowup(){const stages=['待核对材料','已约测评/体验','已完成反馈','方案沟通中','待决策','已签约待交接','已交接','暂缓'];$('#view').innerHTML=heading('03 / FOLLOW UP','每一次跟进，都有下一步。','记录材料、约定和反馈，不用分数给客户贴成交标签。',button('开始新首通','newSalesCall()'))+`<div class="followup-top"><span class="tag">${sales.leads.length} 条真实录入 / 示例记录</span><span class="hint">${sales.persist?'本机保存已开启':'会话模式，刷新可能丢失；可在设置中开启本机保存或下载备份。'}</span></div>${sales.leads.length?`<div class="sales-lead-grid">${sales.leads.map(l=>`<article class="panel sales-lead"><div class="micro">${esc(l.created)} · ${esc(l.call.province)} · ${esc(l.call.grade)}</div><h3>${esc(l.name)}</h3><p>${l.call.rows.map(r=>esc(r.subject)+' '+callScoreText(r)).join(' · ')}</p><label class="field">当前进度<select aria-label="${esc(l.name)}跟进进度" onchange="updateLead('${l.id}','status',this.value)">${options(stages,l.status)}</select></label><label class="field">约定的下次跟进日期<input type="date" value="${esc(l.next)}" onchange="updateLead('${l.id}','next',this.value)"></label><label class="field">本次结论与下一步<textarea oninput="updateLead('${l.id}','note',this.value)">${esc(l.note)}</textarea></label><div class="actions">${button('打开本次咨询',`openLead('${l.id}')`,'outline')}${button('生成交接单',`openHandoff('${l.id}')`,'outline')}</div><details><summary>跟进记录</summary>${l.history.map(h=>`<p class="hint">${esc(h.date)} · ${esc(h.text)}</p>`).join('')}</details></article>`).join('')}</div>`:`<div class="empty"><h3>从一通有内容的电话开始。</h3><p>完成首通后，可将本次咨询加入跟进。不会自动添加姓名或虚构成交数据。</p>${button('进入电话首通',"go('call')")}</div>`}`}
function updateLead(id,key,value){const l=sales.leads.find(l=>l.id===id);if(!l)return;l[key]=value;if(key!=='note')l.history.push({date:TODAY,text:(key==='status'?'跟进进度：':'下次跟进：')+value});salesSave()}
function openLead(id){const l=sales.leads.find(l=>l.id===id);if(!l)return;sales.result=structuredClone(l.call);sales.draft={province:l.call.province,grade:l.call.grade,callId:l.call.id,rows:l.call.rows.map(r=>({subject:r.subject,score:r.score??'',max:r.max??''}))};sales.report=l.report?structuredClone(l.report):null;go('call')}
function newSalesCall(){sales.draft={province:'湖北',grade:'初三',rows:[{subject:'数学',score:'',max:''}]};sales.result=null;sales.report=null;go('call')}
function renderTalks(){const f=salesLibrary,rows=SALES_REFERENCE.filter(k=>k.stage===f.stage&&(f.subject==='全部'||k.subject===f.subject)&&[k.subject,k.point,k.ability,k.probe,k.task,...(k.aliases||[])].join(' ').includes(f.query));$('#view').innerHTML=heading('04 / SUBJECT CONVERSATION','专业，是把问题问得更具体。','融合原首通版132条原创知识沟通卡；这些按学段归类，使用前核对已学进度。')+objectionHTML()+`<div class="toolbar"><select aria-label="沟通库学段" onchange="salesLibrary.stage=this.value;salesLibrary.subject='全部';renderTalks()">${options(Object.keys(SALES_GRADES),f.stage)}</select><select aria-label="沟通库学科" onchange="salesLibrary.subject=this.value;renderTalks()">${options(['全部',...new Set(SALES_REFERENCE.filter(k=>k.stage===f.stage).map(k=>k.subject))],f.subject)}</select><input aria-label="检索沟通知识点" placeholder="检索知识点、追问、验证任务" value="${esc(f.query)}" onchange="salesLibrary.query=this.value;renderTalks()"></div><div class="section-top"><p class="hint">${rows.length} 条匹配 · 范围不等同所有教材全部章节</p>${button('查看六个年级知识分类',"go('knowledge')",'outline')}</div><div class="grid two">${rows.map(k=>`<article class="panel reference-card"><div class="micro">${esc(k.stage)} · ${esc(k.subject)} · 学段参考</div><h3>${esc(k.point)}</h3><p><b>看什么能力</b>${esc(k.ability)}</p><p><b>下一句怎么问</b>${esc(k.probe)}</p><details><summary>任务、解析、教学与衔接</summary><p><b>自编验证任务</b>${esc(k.task)}</p><p><b>参考解析</b>${esc(k.answer)}</p><p><b>可能失分表现</b>${esc(k.error)}</p><p><b>确认后的行动</b>${esc(k.action)}</p><p><b>后续衔接</b>${esc(k.risk)}</p>${k.source?`<p class="hint">参考定位：${esc(k.source.title)} · ${esc(k.source.chapter)} · ${esc(k.source.pages)}。${esc(k.source.scope)}。教辅版次不等于考试政策年份。</p>`:''}</details><button class="text-btn" onclick="copySalesReference('${k.id}')">复制专业沟通提纲 ↗</button><button class="text-btn" onclick="attachSalesReference('${k.id}')">用于本次首通 ＋</button></article>`).join('')||'<p>没有匹配结果，请更换关键词。</p>'}</div>`}
function copySalesReference(id){const k=SALES_REFERENCE.find(k=>k.id===id);if(k)salesCopy(`${k.stage} ${k.subject}｜${k.point}\n先核对是否已学，不凭总分认定薄弱。\n追问：${k.probe}\n验证任务（自编）：${k.task}\n参考解析：${k.answer}\n可能表现：${k.error}\n确认后的行动：${k.action}\n衔接意义：${k.risk}\n复测：用同要求新任务观察独立完成、提示次数与解释依据。`)}
function renderRegions(){const p=knowledge.province,special=['香港','澳门','台湾'].includes(p);$('#view').innerHTML=heading('08 / REGION & ADMISSION','地区口径，要问到具体情境。','地区支持用于首通追问与信息核对；未核实的本地政策不作为销售结论。')+`<div class="panel"><div class="region-grid">${PROVINCES.map(v=>`<button class="${v===p?'active':''}" onclick="knowledge.province='${v}';renderRegions()">${v}</button>`).join('')}</div></div><div class="note">${special?'港澳台分别适用独立课程与考试体系，不能直接套用内地中高考框架。':esc(p)+' · 先确认拟报名归属地与地市、学籍/户籍情境、考试届别、教材、选科和成绩口径。'}</div><div class="grid two"><div class="panel"><h3>首通必须问清的四组信息</h3><ol class="detail-list"><li>地区：居住地与拟报名地是否相同？中考细化到地市。</li><li>年级与届别：目前年级、学制、预计考试年，不把未来推算当作已发布政策。</li><li>成绩：校内阶段测评还是统考？原始分、赋分或折算分？</li><li>目标：希望先解决什么问题？学校进度与实际可用时间如何？</li></ol></div><div class="panel"><h3>和家长这样说</h3><p>“我们先按孩子实际报名地区、学校进度和这次考试口径来分析。政策、分值和录取规则需要核对当地当年官方资料；目前的口述成绩，还不足以判断当地排名和录取结果。”</p><p class="hint">政策、分值和录取规则有年份及地市差异。核对时记录发布机构、发布日期和适用届别；当前信息不足时，不计算录取概率。</p><a class="text-btn" href="${STANDARDS[sales.result?.stage||'初中']}" target="_blank" rel="noopener">查看对应课程标准 ↗</a></div></div>`}
let handoffLead='';
function openHandoff(id){handoffLead=id;go('handoff')}
function renderHandoff(){const l=sales.leads.find(l=>l.id===handoffLead)||sales.leads.find(l=>l.status==='已签约待交接');$('#view').innerHTML=heading('09 / SALES TO SERVICE','把承诺，交接成可执行的信息。','交接前逐项核对学情依据、课程时间、费用和服务口径。')+`<div class="toolbar"><select aria-label="选择交接咨询" onchange="handoffLead=this.value;renderHandoff()"><option value="">选择咨询记录</option>${sales.leads.map(x=>`<option value="${x.id}" ${l?.id===x.id?'selected':''}>${esc(x.name)} · ${esc(x.status)}</option>`).join('')}</select></div>${l?`<div class="panel"><span class="micro">${esc(l.call.grade)} · ${esc(l.call.province)}</span><h3>${esc(l.name)} · 销服交接草稿</h3><p>${l.call.rows.map(r=>esc(r.subject)+'：'+callScoreText(r)).join(' / ')}</p><div class="grid two">${['学情与材料来源','已确认学习目标','实际购买课程与费用','双方确认的可上课时间','销售已承诺的服务范围','待任课教师核对的问题'].map((x,i)=>`<label class="field">${x}<textarea data-handoff="${i}" placeholder="逐项填写已确认事实；未知写待核对">${esc(l.handoff?.[i]||'')}</textarea></label>`).join('')}</div><p class="hint">建议排课与学习方案不代表已确认教师资源；未确认的费用、效果和服务不能写成已承诺事项。</p><div class="actions">${button('保存并下载交接单',`saveHandoff('${l.id}')`)}${button('标记已完成交接',`completeHandoff('${l.id}')`,'outline')}</div></div>`:'<div class="empty"><h3>先选择一条咨询记录。</h3><p>在销售跟进中完成记录后，可生成独立交接单。</p></div>'}`}
function saveHandoff(id){const l=sales.leads.find(l=>l.id===id);if(!l)return;l.handoff=[...document.querySelectorAll('[data-handoff]')].map(x=>x.value.trim());salesSave();const titles=['学情与材料来源','学习目标','购买课程与费用','可上课时间','服务承诺','待核对问题'];download(new Blob([`${l.name} · 销服交接草稿\n${l.call.province} ${l.call.grade}\n`+titles.map((t,i)=>t+'：'+(l.handoff[i]||'待核对')).join('\n\n')],{type:'text/plain;charset=utf-8'}),'销售学管交接单.txt');toast('已保存交接草稿')}
function completeHandoff(id){const l=sales.leads.find(l=>l.id===id);if(!l)return;const values=[...document.querySelectorAll('[data-handoff]')].map(x=>x.value.trim());if(values.some(v=>!v))return toast('请先补齐六项交接信息，再标记完成');l.handoff=values;updateLead(id,'status','已交接');renderHandoff();toast('已标记完成交接')}
function salesSettingsHTML(){return `<div class="panel" style="margin-top:24px"><div class="micro">SALES RECORDS</div><h3>前端销售记录的保存方式</h3><p class="muted">首通草稿和家长姓名默认只在当前会话。点击“加入销售跟进”才建立记录；本机保存仅保存这些主动建立的跟进记录。</p><label class="checkline"><input type="checkbox" ${sales.persist?'checked':''} onchange="sales.persist=this.checked;if(!this.checked)localStorage.removeItem('zhixu-sales-v1');else salesSave();salesUpdateSidebar()">开启销售跟进记录本机保存</label><div class="actions" style="margin-top:16px">${button('导出销售记录备份','exportSalesBackup()','outline')}<label class="btn outline">导入销售记录备份<input type="file" accept="application/json" hidden onchange="importSalesBackup(this.files[0])"></label></div></div>`}
function exportSalesBackup(){download(new Blob([JSON.stringify({format:'zhixu-sales-v1',leads:sales.leads},null,2)],{type:'application/json'}),'伴学一对一销售跟进备份_'+TODAY+'.json')}
async function importSalesBackup(file){if(!file)return;if(file.size>5*1024*1024)return toast('备份文件须小于5MB');try{const v=JSON.parse(await file.text());if(v.format!=='zhixu-sales-v1'||!Array.isArray(v.leads)||!v.leads.every(validSalesLead))throw Error();let n=0;for(const l of v.leads){if(!sales.leads.some(x=>x.id===l.id)){sales.leads.push(l);n++}}salesSave();toast('已导入'+n+'条新记录，相同ID保留当前记录')}catch(e){toast('备份格式或字段无效，未导入')}}
function validSalesLead(l){return !!(l&&typeof l.id==='string'&&/^[a-f0-9-]{16,64}$/.test(l.id)&&typeof l.name==='string'&&typeof l.status==='string'&&typeof l.created==='string'&&typeof l.next==='string'&&typeof l.note==='string'&&Array.isArray(l.history)&&l.history.every(h=>typeof h.date==='string'&&typeof h.text==='string')&&validSalesCall(l.call)&&validSalesReport(l.report,l.call)&&(!l.handoff||Array.isArray(l.handoff)&&l.handoff.length===6&&l.handoff.every(x=>typeof x==='string')))}

function referenceText(r){return (r.references||[]).map(id=>SALES_REFERENCE.find(k=>k.id===id)).filter(Boolean).map(k=>'\n学段补充：'+k.point+'（不是本年级已确认薄弱）\n追问：'+k.probe+'\n验证：'+k.task+'\n确认后：'+k.action).join('\n')}
function referenceAttachments(r,i){const cards=(r.references||[]).map(id=>SALES_REFERENCE.find(k=>k.id===id)).filter(Boolean);return `<div class="reference-attached"><div class="actions"><b>学段沟通补充</b><button class="text-btn" onclick="salesLibrary.stage=sales.result.stage;salesLibrary.subject='全部';go('talks')">从原首通沟通库选择 ↗</button></div>${cards.length?cards.map(k=>`<p>${esc(k.point)}<small> · 先核对已学进度</small><button class="text-btn" onclick="sales.result.rows[${i}].references=sales.result.rows[${i}].references.filter(id=>id!=='${k.id}');sales.report=null;$('#callResult').innerHTML=callResultHTML()">移除</button></p>`).join(''):'<p class="hint">可将原首通版的学科追问与验证任务加入本次沟通和家长方案。</p>'}</div>`}
function attachSalesReference(id){const k=SALES_REFERENCE.find(k=>k.id===id),c=sales.result;if(!c)return toast('请先生成一次首通信息');const row=c.rows.find(r=>r.subject===k?.subject);if(!k||k.stage!==c.stage||!row)return toast('请选与本次首通相同学段、已选学科的知识卡');row.references??=[];if(row.references.includes(id))return toast('已添加此知识卡');if(row.references.length>=3)return toast('每科最多添加3条补充卡');row.references.push(id);sales.report=null;toast('已加入'+row.subject+'首通提纲与家长方案')}
const SALES_OBJECTIONS=[
 ['价格有点高','先区分总预算、课时单价和效果不确定性。','“您更担心整体预算，还是还没看清课程能解决什么问题？我们先用一次实际作答确认需求，再按可以投入的时间比较方案。价格、有效期和服务以正式报价为准。”','核对预算边界与服务明细，不把赠品替代教学价值。'],
 ['我再考虑一下','先了解尚未解决的具体疑问与共同决策安排。','“当然可以。您现在主要还在比较课程安排、老师匹配，还是学习目标是否合适？我们先把这一个问题讲清楚，再约您方便的时间继续。”','约定一个有内容的后续沟通，不制造虚假限时。'],
 ['孩子没有时间','先看每周真实可用总时间及现有任务。','“那先不加量。孩子这一周哪些时间可以稳定安排？我们把讲解、练习和复测放进同一份时间预算，看看是否能执行，再决定课程频率。”','用全科共享时间预算验证可行性。'],
 ['一对一真的有用吗','把效果落实到具体问题、动作与复测证据。','“一对一的价值要看能否针对已确认的卡点调整讲解和练习。我们可以先看一题独立作答，再比较提示次数、解释过程与换题表现，而不是只凭一节课的感觉判断。”','用可比任务观察变化，不承诺固定分数。'],
 ['孩子不愿意学','区分任务难度、挫败体验、安排冲突与意愿。','“孩子最排斥的是哪一种情境？是不会做、重复练习太多，还是上课时间不合适？可以先给一个能独立完成的小任务，听听孩子自己的感受。”','先听孩子反馈，设计小目标，避免给孩子贴态度标签。'],
 ['已经在别家上课了','了解现有支持与具体缺口，避免重复安排。','“现在的课程里，哪些部分对孩子已经有帮助？还有哪一类问题没被解决？我们先核对具体差异，确认有没有新增价值，再决定是否需要调整。”','比较证据、范围和执行方式，不贬低其他机构。']

function safeURL(url){try{let u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(e){return ''}}
function addResource(){modal('添加可追溯的试卷资料',`<form onsubmit="saveResource(event)"><div class="form-grid"><label class="field">试卷名称<input name="title" required></label><label class="field">年份<select name="year">${options([2026,2025,2024],2026)}</select></label><label class="field">类型<select name="kind">${options(['重点试卷','中考','高考','八省联考','其他考试'],'重点试卷')}</select></label><label class="field">地区<input name="region" required placeholder="省／地市／学校"></label><label class="field">学科<select name="subject">${options(['全科',...SUBJECTS.高中],'数学')}</select></label><label class="field">发布机构<input name="source" required></label></div><label class="field">原始资料链接<input name="url" type="url" required placeholder="https://…"></label><label class="field" style="margin:15px 0">备注与授权情况<textarea name="note" required></textarea></label><p class="hint">只登记原始链接，不复制或绕过原站下载权限。新增材料标记为“用户补录”。</p>${button('保存资料','', '')}</form>`)}
function saveResource(e){e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.url=safeURL(p.url);if(!p.url)return toast('请输入有效的HTTP或HTTPS链接');state.papers.push({...p,id:uid(),status:'用户补录'});save();$('#modal').close();renderPapers();toast('资料已补录')}
function usePaper(id){currentPaper=[...PAPERS,...state.papers].find(p=>p.id===id);draftRows=[];go('analysis')}
function studentCard(s){let low=[...s.scores].sort((a,b)=>a.score/a.max-b.score/b.max)[0];return `<article class="panel student-card"><div class="sid">${esc(s.code||s.id.slice(0,8))} ${s.demo?' / 示例数据':''}</div><h3>${esc(s.name)}</h3><div class="muted">${esc(s.province)} · ${esc(s.city||'地市未填')} · ${esc(s.grade)}</div><hr class="divider"><div class="micro">${low?'当前最低得分率':'尚未录入成绩'}</div>${low?`<span class="big-number">${Math.round(low.score/low.max*100)}<small style="font-size:16px">%</small></span><span class="pill" style="margin-left:12px">${esc(low.subject)} ${low.score}/${low.max}</span>`:'<p class="hint">先录入最近一次考试，建立可比较的起点。</p>'}<div class="actions">${button('打开档案',`openStudent('${s.id}')`,'small outline')}<button class="text-btn" onclick="state.active='${s.id}';go('plan')">查看方案 ↗</button></div></article>`}
function renderStudents(){let s=activeStudent();$('#view').innerHTML=heading('05 / STUDENT RECORDS','先看见人，再看见分数。','同一位学生的分数、错题、目标和学习时间，在这里连接。',button('＋ 建立档案','editStudent()'))+`<div class="toolbar">${studentPicker()}<input placeholder="搜索姓名、学员编号或地区" aria-label="搜索学员" oninput="filterStudents(this.value)"><button class="text-btn" onclick="loadDemo()">载入示例</button></div><div id="studentCards" class="grid three">${state.students.map(studentCard).join('')}</div>${!state.students.length?noStudent():''}${s?studentDetail(s):''}`}
function filterStudents(q){$('#studentCards').innerHTML=state.students.filter(s=>`${s.name}${s.code}${s.province}${s.city}`.includes(q)).map(studentCard).join('')}
function openStudent(id){state.active=id;save();if(page!=='students')go('students');else renderStudents();$('#studentDetail')?.scrollIntoView({behavior:'smooth',block:'start'})}
function studentDetail(s){return `<div id="studentDetail" style="margin-top:30px">${heading('STUDENT PROFILE',esc(s.name)+' · 学情档案',`${esc(s.province)} / ${esc(s.city||'地市待补')} / ${esc(s.grade)} / ${esc(s.textbook||'教材版本待补')}`,button('编辑档案',`editStudent('${s.id}')`,'outline')+button('删除',`deleteStudent('${s.id}')`,'outline'))}<div class="grid two"><div class="panel"><h3>最近一次各科成绩</h3><div class="table-wrap"><table><thead><tr><th>学科</th><th>当前 / 满分</th><th>目标</th><th>得分率</th></tr></thead><tbody>${s.scores.map(r=>`<tr><td>${esc(r.subject)}</td><td>${r.score} / ${r.max}</td><td>${r.target}</td><td>${Math.round(r.score/r.max*100)}%<div class="score-bar"><span style="width:${r.score/r.max*100}%"></span></div></td></tr>`).join('')}</tbody></table></div><p class="hint">考试：${esc(s.exam||'待填')} · 日期：${esc(s.examDate||'待填')} · 分数口径：${esc(s.scoreType||'原始分')}<br>不同满分用得分率横向查看；不同考试难度、赋分与原始分不可直接比较。</p></div><div class="panel"><h3>学生画像与服务重点</h3><div class="micro">薄弱描述</div><p>${esc(s.weak||'尚未填写，请结合答题证据补充。')}</p><div class="micro">学习习惯与约束</div><p>${esc(s.habit||'尚未填写')}</p><div class="micro">阶段目标</div><p>${esc(s.goal||'尚未填写')}</p><div class="micro">学管师 / 负责教师</div><p>${esc(s.advisor||'未填')} / ${esc(s.teacher||'排课时指定')}</p><div class="actions">${button('开始试卷诊断',"go('analysis')",'small outline')}${button('生成提分方案',"go('plan')",'small')}${button('安排课程',"go('schedule')",'small outline')}</div></div></div></div>`}
function gradeOptions(stage){return stage==='小学'?['一年级','二年级','三年级','四年级','五年级','六年级']:stage==='初中'?['初一','初二','初三']:['高一','高二','高三']}
function editStudent(id){const s=state.students.find(x=>x.id===id)||{stage:'初中',province:'湖北',grade:'初三',scores:[]};modal(id?'编辑学生档案':'建立学生档案',`<form id="studentForm" onsubmit="saveStudent(event,'${id||''}')"><div class="form-grid"><label class="field">姓名／称呼 *<input name="name" value="${esc(s.name||'')}" required maxlength="40"></label><label class="field">学员编号 *<input name="code" value="${esc(s.code||'S'+String(Date.now()).slice(-6))}" required maxlength="30"></label><label class="field">省级地区<select name="province">${options(PROVINCES,s.province)}</select></label><label class="field">地市／区县<input name="city" value="${esc(s.city||'')}" placeholder="中考须明确地市"></label><label class="field">学段<select name="stage" onchange="$('#gradeInput').innerHTML=options(gradeOptions(this.value),'');$('#scoreInput').innerHTML=scoreInputRows([],this.value)">${options(Object.keys(SUBJECTS),s.stage)}</select></label><label class="field">年级<select id="gradeInput" name="grade">${options(gradeOptions(s.stage),s.grade)}</select></label><label class="field">教材版本／选科<input name="textbook" value="${esc(s.textbook||'')}" placeholder="如：人教版；物化生"></label><label class="field">考试名称<input name="exam" value="${esc(s.exam||'')}" placeholder="学校、考试范围、卷型"></label><label class="field">考试日期<input type="date" name="examDate" value="${esc(s.examDate||TODAY)}"></label><label class="field">分数口径<select name="scoreType">${options(['原始分','折算分','等级赋分'],s.scoreType||'原始分')}</select></label><label class="field">销售顾问／交接负责人<input name="advisor" value="${esc(s.advisor||'')}"></label><label class="field">主要负责教师<input name="teacher" value="${esc(s.teacher||'')}" placeholder="用于跨学员课时冲突检测"></label></div><h3>成绩与目标 <small class="muted">可按实际科目添加</small></h3><div class="table-wrap"><table><thead><tr><th>学科</th><th>当前分</th><th>满分</th><th>目标分</th><th></th></tr></thead><tbody id="scoreInput">${scoreInputRows(s.scores.length?s.scores:[{subject:'数学',score:65,max:120,target:90}],s.stage)}</tbody></table></div><button type="button" class="text-btn" style="margin:12px 0" onclick="$('#scoreInput').insertAdjacentHTML('beforeend',scoreInputRows([{subject:'英语',score:0,max:100,target:80}],$('#studentForm [name=stage]').value))">＋ 添加科目</button><div class="form-grid" style="grid-template-columns:1fr 1fr"><label class="field">薄弱内容与证据<textarea name="weak" rows="3" placeholder="具体到知识点或答题表现">${esc(s.weak||'')}</textarea></label><label class="field">学习习惯与时间约束<textarea name="habit" rows="3">${esc(s.habit||'')}</textarea></label></div><label class="field">阶段目标<textarea name="goal" rows="2" placeholder="如：4周内基础题正确率从60%提高到80%">${esc(s.goal||'')}</textarea></label><p class="hint">未开启本机保存时，关闭页面会丢失新录入内容；可在“资料与设置”中随时导出备份。</p><button class="btn" type="submit">保存档案</button></form>`)}
function scoreInputRows(rows,stage){return rows.map(r=>`<tr><td><select class="r-subject">${options(SUBJECTS[stage],r.subject)}</select></td><td><input type="number" step="0.5" min="0" class="r-score" value="${r.score}" required></td><td><input type="number" min="1" step="0.5" class="r-max" value="${r.max}" required></td><td><input type="number" min="0" step="0.5" class="r-target" value="${r.target}" required></td><td><button type="button" class="text-btn" aria-label="删除科目" onclick="this.closest('tr').remove()">×</button></td></tr>`).join('')}
function saveStudent(e,id){e.preventDefault();const form=e.target,values=Object.fromEntries(new FormData(form)),scores=[...form.querySelectorAll('#scoreInput tr')].map(tr=>({subject:tr.querySelector('.r-subject').value,score:+tr.querySelector('.r-score').value,max:+tr.querySelector('.r-max').value,target:+tr.querySelector('.r-target').value}));if(new Set(scores.map(r=>r.subject)).size!==scores.length)return toast('同一学科请仅保留一行');if(scores.some(r=>![r.score,r.max,r.target].every(Number.isFinite)||r.max<=0||r.score<0||r.score>r.max||r.target<0||r.target>r.max))return toast('请检查分数：当前分和目标分须在0至满分之间');if(state.students.some(s=>s.code===values.code&&s.id!==id))return toast('学员编号已存在，请使用唯一编号');let old=state.students.find(s=>s.id===id);let s={...old,...values,scores,id:id||uid(),updated:TODAY};if(old)state.students[state.students.indexOf(old)]=s;else state.students.push(s);state.active=s.id;save();$('#modal').close();render();toast('学员档案已更新')}
function deleteStudent(id){modal('删除此学生档案？',`<p>将移除这位学生的成绩、试卷分析和已排课程。已导出的备份不会受影响。</p><div class="actions">${button('确认删除',`confirmDeleteStudent('${id}')`,'danger')}${button('保留档案',"$('#modal').close()",'outline')}</div>`)}
function confirmDeleteStudent(id){state.students=state.students.filter(s=>s.id!==id);state.active=state.students[0]?.id||'';save();$('#modal').close();render();toast('档案已删除')}
function loadDemo(){let found=state.students.find(x=>x.demo);if(found){state.active=found.id;render();return toast('已切换到示例学员')}const id=uid();state.students.push({id,code:'DEMO-001',name:'林同学（示例）',demo:true,province:'湖北',city:'武汉',stage:'初中',grade:'初三',textbook:'人教版 · 示例',exam:'校内阶段测评（示例）',examDate:TODAY,scoreType:'原始分',advisor:'示例学管师',teacher:'示例数学教师',weak:'二次函数图像与参数讨论不完整；几何证明依据省略；英语阅读推断题证据不足。',habit:'周一、三、五晚及周末可上课，每天最多2节；做题容易在难题停留过久。',goal:'先稳定数学基础题与中档题，再检查函数迁移；4周后以同范围新卷验收。',scores:[{subject:'语文',score:82,max:120,target:95},{subject:'数学',score:68,max:120,target:90},{subject:'英语',score:91,max:120,target:105},{subject:'物理',score:51,max:70,target:60},{subject:'化学',score:38,max:50,target:44}],analyses:[{id:uid(),title:'数学阶段测评（示例）',subject:'数学',date:TODAY,total:120,duration:120,rows:[{no:'1—8',topic:'数与式、方程与不等式',max:24,score:21,cause:'运算失误',minutes:18},{no:'9—12',topic:'函数与图像',max:18,score:9,cause:'知识缺口',minutes:25},{no:'13—18',topic:'图形与几何',max:30,score:16,cause:'表达不规范',minutes:30},{no:'19—21',topic:'统计、概率与应用建模',max:24,score:17,cause:'方法缺口',minutes:22},{no:'22—23',topic:'函数与图像',max:24,score:5,cause:'方法缺口',minutes:25}]}],availability:Array.from({length:7},(_,d)=>[36,37,38,39,40,41].filter(()=>[0,2,4,5,6].includes(d)).map(t=>`${d}-${t}`)).flat()});state.active=id;save();render();toast('已载入明确标注的示例数据')}
function renderAnalysis(){const s=activeStudent();$('#view').innerHTML=heading('04 / PAPER DIAGNOSIS','不止于分数，更看清失分。','将每一题的结果还原为知识、方法与执行问题。',studentPicker());if(!s){$('#view').innerHTML+=noStudent();return}const subj=currentPaper?.subject&&SUBJECTS[s.stage].includes(currentPaper.subject)?currentPaper.subject:'数学';$('#view').innerHTML+=`<div class="grid two"><div class="panel"><div class="micro">01 / SOURCE & CONTEXT</div><h3>试卷与作答资料</h3><div class="drop" id="paperDrop">拖拽／选择 PDF、试卷图片，或直接粘贴截图<br><label class="file-label text-btn">选择试卷文件<input type="file" id="paperUpload" accept="application/pdf,image/*" hidden onchange="previewPaper(this.files[0])"></label><div class="hint">文件仅在本页预览，不上传。逐题分数由学管录入或粘贴表格；此版不自动识别图片内容。</div></div><div id="paperPreview"></div><div class="form-grid" style="grid-template-columns:1fr 1fr;margin-top:18px"><label class="field">试卷名称<input id="aTitle" value="${esc(currentPaper?.title||'')}" placeholder="如：初三数学期中考"></label><label class="field">学科<select id="aSubject" onchange="updateTopicOptions()">${options(SUBJECTS[s.stage],subj)}</select></label><label class="field">卷面满分<input id="aTotal" type="number" min="1" value="${s.scores.find(x=>x.subject===subj)?.max||100}"></label><label class="field">考试时长（分钟）<input id="aDuration" type="number" min="1" value="120"></label></div><label class="field">粘贴逐题数据（制表符或逗号分隔）<textarea id="aPaste" rows="3" placeholder="题号,知识点,满分,得分,错因,耗时\n1,二次函数,5,2,方法缺口,8"></textarea></label><div class="actions" style="margin-top:10px">${button('读取表格数据','parseRows()','small outline')}${button('下载填表模板','downloadTemplate()','small outline')}</div></div><div class="panel"><div class="micro">02 / DIAGNOSTIC RECORDS</div><h3>历史诊断</h3>${(s.analyses||[]).length?(s.analyses||[]).slice().reverse().map(a=>`<div class="task"><div class="body"><b>${esc(a.title)}</b><p>${a.date} · ${esc(a.subject)} · ${a.rows.reduce((n,r)=>n+r.score,0)} / ${a.total} 分</p></div><button class="text-btn" onclick="showAnalysis('${a.id}')">查看 ↗</button></div>`).join(''):'<p class="hint">还没有诊断记录。先登记一份真实试卷，建立可追踪的起点。</p>'}<hr class="divider"><h4>把“粗心”拆开看</h4><p class="hint">审题偏差、运算失误、表达不规范，需要不同训练。先用答题证据分类，再决定是否需要重新讲概念。</p><div class="actions">${CAUSES.map(c=>`<span class="tag">${c}</span>`).join('')}</div></div></div><div class="panel" style="margin-top:20px"><div class="section-top"><div><div class="micro">03 / QUESTION-LEVEL EVIDENCE</div><h3 style="margin:0">逐题得分与错因</h3></div><div class="actions">${button('＋ 添加题目','addAnalysisRow()','small outline')}${button('保存并生成诊断','commitAnalysis()','small')}</div></div><div class="table-wrap"><table style="min-width:800px"><thead><tr><th style="width:9%">题号</th><th style="width:29%">知识点／题型</th><th style="width:10%">满分</th><th style="width:10%">得分</th><th style="width:20%">主要错因</th><th style="width:12%">耗时(分)</th><th></th></tr></thead><tbody id="analysisRows"></tbody></table></div><p class="hint">可将小题合并登记，须注明题号范围。登记满分之和必须等于卷面满分；不完整数据先补齐，避免用局部样本推断整卷。</p></div><div id="analysisResult"></div>`;if(!draftRows.length)draftRows=[{no:'1',topic:topics(s.stage,subj)[0]?.[0]||'',max:5,score:0,cause:'知识缺口',minutes:0}];drawRows();wireDrop();if(paperImage)showPaperPreview();}
function rowHTML(r,i){return `<tr data-index="${i}"><td><input aria-label="题号" data-key="no" value="${esc(r.no)}"></td><td><input aria-label="知识点" data-key="topic" value="${esc(r.topic)}" list="topicSuggestions"></td><td><input aria-label="题目满分" type="number" data-key="max" min="0.5" step="0.5" value="${r.max}"></td><td><input aria-label="题目得分" type="number" data-key="score" min="0" step="0.5" value="${r.score}"></td><td><select aria-label="主要错因" data-key="cause">${options(CAUSES,r.cause)}</select></td><td><input aria-label="作答耗时" type="number" data-key="minutes" min="0" step="0.5" value="${r.minutes||0}"></td><td><button class="text-btn" aria-label="删除题目" onclick="readRows();draftRows.splice(${i},1);drawRows()">×</button></td></tr>`}
function drawRows(){$('#analysisRows').innerHTML=draftRows.map(rowHTML).join('')+`<datalist id="topicSuggestions">${topics(activeStudent().stage,$('#aSubject').value,activeStudent().grade).map(t=>`<option value="${esc(t[0])}">`).join('')}</datalist>`}
function readRows(){draftRows=$$('#analysisRows tr').map(tr=>{let r={};tr.querySelectorAll('[data-key]').forEach(el=>r[el.dataset.key]=['max','score','minutes'].includes(el.dataset.key)?Number(el.value):el.value.trim());return r});}
function addAnalysisRow(){readRows();draftRows.push({no:String(draftRows.length+1),topic:'',max:5,score:0,cause:'知识缺口',minutes:0});drawRows()}
function updateTopicOptions(){readRows();drawRows()}
function parseRows(){let lines=$('#aPaste').value.trim().split(/\r?\n/),rows=[];for(let line of lines){let cols=line.split(/\t|,|，/).map(x=>x.trim());if(cols[0]==='题号')continue;if(cols.length<5||!Number.isFinite(+cols[2])||!Number.isFinite(+cols[3]))return toast('数据格式不正确，请按模板的六列粘贴');if(!CAUSES.includes(cols[4]))return toast('错因须使用页面中的六种分类之一');rows.push({no:cols[0],topic:cols[1],max:+cols[2],score:+cols[3],cause:cols[4],minutes:+(cols[5]||0)})}if(!rows.length)return toast('请先粘贴有效数据');draftRows=rows;drawRows();toast(`已读取${rows.length}条，请核对后保存`)}

function previewPaper(file){if(!file)return;if(!file.type.startsWith('image/')&&file.type!=='application/pdf')return toast('请选择PDF或图片');if(file.size>30*1024*1024)return toast('请选择30MB以内的文件');if(paperImage)URL.revokeObjectURL(paperImage);paperImage=URL.createObjectURL(file);paperImageType=file.type;showPaperPreview()}

function commitAnalysis(){readRows();let total=+$('#aTotal').value,duration=+$('#aDuration').value,title=$('#aTitle').value.trim(),subject=$('#aSubject').value;if(!title)return toast('请填写试卷名称');if(total<=0||duration<=0||!Number.isFinite(total+duration))return toast('满分和考试时长须为正数');if(!draftRows.length||draftRows.some(r=>!r.no||!r.topic||![r.max,r.score,r.minutes].every(Number.isFinite)||r.max<=0||r.score<0||r.score>r.max||r.minutes<0))return toast('请完整填写题号和考点，得分须在0至题目满分之间');if(new Set(draftRows.map(r=>r.no)).size!==draftRows.length)return toast('题号重复，请检查');let sum=draftRows.reduce((n,r)=>n+r.max,0);if(Math.abs(sum-total)>.001)return toast(`登记题目满分合计${sum}，须与卷面满分${total}一致`);let s=activeStudent(),a={id:uid(),title,subject,total,duration,date:TODAY,source:currentPaper?.url||'',rows:structuredClone(draftRows)};s.analyses??=[];s.analyses.push(a);save();$('#analysisResult').innerHTML=analysisHTML(a);$('#analysisResult').scrollIntoView({behavior:'smooth',block:'start'});toast('诊断已保存，提分方案已可读取此数据')}
function aggregate(a){const topics=Object.create(null),causes=Object.create(null);for(let r of a.rows){let loss=r.max-r.score;topics[r.topic]??={max:0,score:0,loss:0,causes:{}};topics[r.topic].max+=r.max;topics[r.topic].score+=r.score;topics[r.topic].loss+=loss;topics[r.topic].causes[r.cause]=(topics[r.topic].causes[r.cause]||0)+loss;causes[r.cause]=(causes[r.cause]||0)+loss}return {topics:Object.entries(topics).map(([name,v])=>({name,...v})).sort((a,b)=>b.loss-a.loss),causes:Object.entries(causes).map(([name,loss])=>({name,loss})).filter(c=>c.loss>0).sort((a,b)=>b.loss-a.loss),score:a.rows.reduce((n,r)=>n+r.score,0),time:a.rows.reduce((n,r)=>n+(r.minutes||0),0)}}
function analysisHTML(a){let v=aggregate(a);return `<div class="panel" style="margin-top:22px"><div class="section-top"><div><div class="overline">DIAGNOSTIC REPORT</div><h2>${esc(a.title)}</h2></div>${button('下载4K诊断长图',`exportAnalysis('${a.id}')`,'outline')}</div><div class="stats"><div class="stat"><label>卷面得分</label><strong>${v.score}</strong><small>/ ${a.total}</small></div><div class="stat"><label>得分率</label><strong>${Math.round(v.score/a.total*100)}%</strong></div><div class="stat"><label>失分总额</label><strong>${a.total-v.score}</strong><small>分</small></div><div class="stat"><label>登记用时</label><strong>${v.time}</strong><small>/ ${a.duration}分</small></div></div><div class="grid two"><div><h3>知识点失分分布</h3><table><thead><tr><th>考点</th><th>得分／满分</th><th>失分</th><th>掌握表现</th></tr></thead><tbody>${v.topics.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.score}/${t.max}</td><td>${t.loss}</td><td><span class="tag ${t.score/t.max<.6?'red':'green'}">${Math.round(t.score/t.max*100)}%</span></td></tr>`).join('')}</tbody></table></div><div><h3>错因与下一步</h3>${v.causes.length?v.causes.map(c=>`<div class="task"><div class="body"><b>${c.name} · ${c.loss}分</b><p>${CAUSE_ACTION[c.name]?.[1]||'补充答题证据后进行复测。'}</p></div></div>`).join(''):'<p class="hint">登记范围内未失分；建议用不同设问的新题检验迁移。</p>'}</div></div><div class="note">这是一份基于学管录入数据的规则诊断。${v.time>a.duration?'登记用时超过考试时长，请核对是否包含回看时间。':'耗时为0表示尚未记录，不能据此判断速度。'} 单次试卷只反映该次任务表现，提分空间须用后续测评验证。</div>${button('生成对应提分任务',"go('plan')")}</div>`}

function planData(s){let scores=[...s.scores].map(r=>({...r,rate:r.score/r.max,gap:Math.max(0,r.target-r.score)})).sort((a,b)=>(b.gap/b.max)-(a.gap/a.max));let latest=latestAnalysis(s),v=latest?aggregate(latest):null;return {scores,latest,v,focus:v?.topics.filter(t=>t.loss>0).slice(0,3)||[]}}
function renderPlan(){let s=activeStudent();$('#view').innerHTML=heading('06 / A PATH TO PROGRESS','把目标，拆成能做到的每一步。','依据得分率、目标差距和逐题错因生成四周任务；每周用新题复测。',studentPicker());if(!s){$('#view').innerHTML+=noStudent();return}let p=planData(s),top=p.scores.filter(r=>r.gap>0).slice(0,3),has=top.length||p.focus.length;$('#view').innerHTML+=`<div class="section-top"><div class="actions"><span class="tag blue">${esc(s.name)}</span><span class="tag">${esc(s.grade)}</span><span class="tag">${esc(s.province)} · ${esc(s.city)}</span></div><div class="actions">${button('导出4K学习方案','exportPlan()','outline')}${button('转入排课',"go('schedule')")}</div></div><div class="grid two"><div class="panel"><div class="micro">LEARNING PRIORITIES</div><h3>先做什么，为什么。</h3>${p.scores.length?`<table><thead><tr><th>科目</th><th>得分率</th><th>目标差距</th><th>建议顺序</th></tr></thead><tbody>${p.scores.map((r,i)=>`<tr><td>${r.subject}</td><td>${Math.round(r.rate*100)}%</td><td>${r.gap}分</td><td>${r.gap>0?`${i+1} · ${r.rate<.6?'先稳基础':'巩固中档与迁移'}`:'目标已达到，维持复测'}</td></tr>`).join('')}</tbody></table>`:'<p class="hint">尚无分数，先补充成绩或试卷诊断，不能计算优先顺序。</p>'}<p class="hint">排序依据：目标差距／学科满分，由高到低。它是任务优先级，不代表保证可提分。</p></div><div class="panel blue"><div class="micro">EVIDENCE FIRST</div><h3>${p.latest?'本次任务的证据':'先补证据，再细化方案'}</h3>${p.latest?`<p class="muted">最近诊断：${esc(p.latest.title)} · ${p.latest.date}</p>${p.focus.map(t=>{let cause=Object.entries(t.causes).sort((a,b)=>b[1]-a[1])[0]?.[0];return `<div class="task"><div class="body"><b>${esc(t.name)} · 失${t.loss}分</b><p>${cause} → ${CAUSE_ACTION[cause]?.[0]}</p></div></div>`}).join('')||'<p>该卷未记录失分，建议增加新题迁移测评。</p>'}`:`<p>当前只能按分数与目标确定宽泛方向。请补录一份完整试卷，才能把薄弱描述转换成可追踪任务。</p>${button('补录试卷诊断',"go('analysis')",'outline')}`}</div></div><div class="section-top" style="margin-top:28px"><h3>四周行动路径 / THE NEXT FOUR WEEKS</h3><span class="muted">${has?'规则生成 · 需学管与任课教师确认':'资料不足 · 下方为测评流程模板'}</span></div><div class="grid four">${planWeeks(s,p).map((w,i)=>`<div class="plan-step"><div class="weekno">Week 0${i+1}</div><h3>${w.title}</h3><p>${esc(w.task)}</p><div class="micro" style="margin-top:18px">验收 / CHECKPOINT</div><p class="hint">${esc(w.check)}</p></div>`).join('')}</div><div class="panel" style="margin-top:22px"><h3>可直接执行的薄弱项任务</h3>${p.focus.length?p.focus.map(t=>{let c=Object.entries(t.causes).sort((a,b)=>b[1]-a[1])[0][0],action=CAUSE_ACTION[c];let subjectTopics=topics(s.stage,p.latest.subject),matching=subjectTopics.find(x=>x[0]===t.name);return `<div class="task"><div class="body"><b>${esc(t.name)} / ${c}</b><p>课堂：${esc(matching?.[3]||action[1])}<br>练习：${esc(matching?.[4]||action[1])}<br>验收：${action[2]}</p></div></div>`}).join(''):'<p class="hint">录入逐题诊断后，这里将显示具体考点对应的训练与验收。当前不根据一句“基础差”猜测知识漏洞。</p>'}<hr class="divider"><div class="micro">家长沟通摘要</div><textarea id="parentSummary" rows="5">${esc(parentSummary(s,p))}</textarea><div class="actions" style="margin-top:12px">${button('复制沟通摘要',"copyText($('#parentSummary').value)",'small outline')}</div></div><div class="note warm">目标分是期望值，不能作为提分承诺。每周回看完成率、新题正确率、独立完成程度和实际用时，再调整课程安排。不同难度试卷之间的分差需结合难度与考试范围解释。</div>`}
function planWeeks(s,p){let focus=p.focus.map(t=>t.name).join('、')||p.scores.filter(x=>x.gap>0).slice(0,2).map(x=>x.subject).join('、')||'各科前置能力';return [{title:'测清起点 · 补齐前置',task:`聚焦${focus}。先完成前置小测，建立错因清单，优先补概念与基本操作。`,check:'能脱离答案解释概念与适用条件；前置新题正确率目标80%。'},{title:'方法拆解 · 同类变式',task:`将重点任务拆成识别条件、选择方法、执行与检验；同考点做3组不同设问练习。`,check:'不提示解题路径，检查关键步骤是否能独立完成。'},{title:'综合迁移 · 限时训练',task:'混合基础与中档题；分配作答时间，记录卡题、跳过与回看行为，逐题校验表达。',check:'基础与中档题正确率稳定，再逐步缩短耗时；不同情境仍能迁移。'},{title:'新卷复测 · 调整路径',task:'采用同范围、相近难度的新卷复测；对比考点得分率、错因占比与独立完成表现。',check:'用新题证据判断是否达标；未达标则减少新内容、返回具体薄弱环节。'}]}
function parentSummary(s,p){let f=p.focus.map(t=>`${t.name}（本卷失${t.loss}分）`).join('、');return `${s.name}家长您好：\n${p.latest?`根据${p.latest.date}的${p.latest.title}，目前优先关注${f||'知识迁移与稳定性'}。`:'目前已建立学情档案，下一步需要结合完整试卷确认具体失分原因。'}\n接下来四周安排：第1周补前置，第2周做方法与变式，第3周做限时综合，第4周用同范围新卷复测。\n我们将用新题正确率、独立完成程度和用时反馈学习变化，再调整课程；目标分为阶段期望，不作分数保证。`}

function renderSchedule(){let s=activeStudent();$('#view').innerHTML=heading('07 / THE SMART TIMETABLE','让好的计划，落在时间里。','按学员空闲时段生成一周课程；规则排课，自动检查时段、教师冲突与课次上限。',studentPicker());if(!s){$('#view').innerHTML+=noStudent();return}let req=s.requests||planData(s).scores.filter(x=>x.gap>0).slice(0,3).map((r,i)=>({subject:r.subject,count:i===0?2:1,duration:60,teacher:s.teacher||'',priority:i+1}));if(!req.length)req=[{subject:'数学',count:2,duration:60,teacher:s.teacher||'',priority:1}];$('#view').innerHTML+=`<div class="grid two"><div class="panel"><div class="section-top"><div><div class="micro">01 / AVAILABILITY</div><h3 style="margin:0">${esc(s.name)} · 每周可上课时间</h3></div><button class="text-btn" onclick="quickAvailability()">填入晚间示例</button></div><p class="hint">点击每个30分钟格子切换。绿色表示空闲；60分钟课程需要连续两个格子，90分钟需三个。时间按北京时间展示。</p><div class="table-wrap" style="max-height:425px"><table class="week" style="min-width:620px"><thead style="position:sticky;top:0;z-index:1"><tr><th>北京时间</th>${DAYS.map((d,i)=>`<th><button class="text-btn" onclick="toggleDay(${i})" title="切换全天可用">${d}</button></th>`).join('')}</tr></thead><tbody>${Array.from({length:28},(_,i)=>i+16).map(t=>`<tr><th>${timeLabel(t)}</th>${DAYS.map((d,i)=>`<td tabindex="0" role="button" aria-label="${d}${timeLabel(t)}可用时间" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSlot(${i},${t},this)}" class="${(s.availability||[]).includes(i+'-'+t)?'avail':'off'}" onclick="toggleSlot(${i},${t},this)">${(s.availability||[]).includes(i+'-'+t)?'可上课':'·'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div><div class="panel"><div class="micro">02 / COURSE REQUIREMENTS</div><h3>科目、课次与排课约束</h3><div class="form-grid" style="grid-template-columns:1fr 1fr"><label class="field">周起始日（周一）<input id="weekStart" type="date" value="${s.schedule?.start||monday()}"></label><label class="field">每天最多课次<select id="dailyMax">${options([1,2,3,4],s.dailyMax||2)}</select></label><label class="field">课间最少休息<select id="minGap">${[0,30,60].map(n=>`<option value="${n}" ${n===(s.minGap??30)?'selected':''}>${n}分钟</option>`).join('')}</select></label><label class="field">教师共同可上课窗口<select id="teacherWindow">${['08:00—22:00','16:00—22:00','18:00—22:00','08:00—18:00'].map((v,i)=>`<option value="${i}" ${i===(s.teacherWindow||0)?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="table-wrap"><table style="min-width:460px"><thead><tr><th>科目</th><th>课次</th><th>时长</th><th>教师（必填）</th><th></th></tr></thead><tbody id="requestRows">${req.map(requestRow).join('')}</tbody></table></div><div class="actions" style="margin-top:12px">${button('＋ 科目',"addRequest()",'small outline')}${button('生成课程表','generateSchedule()','small')}</div><p class="hint">从上到下是优先顺序；默认参考目标差距。会检查当前浏览器中其他学生同一教师、同一日期的已排课程。未录入的外部安排无法检测。此版未接入机构共享教师日历。</p></div></div><div id="scheduleResult">${s.schedule?scheduleHTML(s):''}</div>`}

function toggleSlot(d,t,el){let s=activeStudent();s.availability??=[];let key=d+'-'+t;if(s.availability.includes(key))s.availability=s.availability.filter(k=>k!==key);else s.availability.push(key);el.className=s.availability.includes(key)?'avail':'off';el.textContent=s.availability.includes(key)?'可上课':'·';save()}

function overlaps(a,b,gap=0){return a.start<b.end+gap&&b.start<a.end+gap}
function solveSchedule({requests,availability,start,dailyMax,gap,windowRange,external}){let lessons=[],unplaced=[];const avail=new Set(availability);for(let r of requests){for(let n=0;n<r.count;n++){let candidates=[];for(let d=0;d<7;d++){let daily=lessons.filter(l=>l.day===d);if(daily.length>=dailyMax)continue;for(let t=windowRange[0];t+r.duration/30<=windowRange[1];t++){let end=t+r.duration/30;if(!Array.from({length:r.duration/30},(_,i)=>`${d}-${t+i}`).every(k=>avail.has(k)))continue;let c={day:d,start:t,end,subject:r.subject,teacher:r.teacher,duration:r.duration,date:dateAt(start,d)};if(daily.some(l=>overlaps(c,l,gap/30)))continue;if(external.some(l=>l.date===c.date&&l.teacher===c.teacher&&overlaps(c,l)))continue;let same=daily.filter(l=>l.subject===r.subject).length;let cost=daily.length*100+same*200+d*2+t/100;candidates.push({...c,cost})}}candidates.sort((a,b)=>a.cost-b.cost);if(candidates.length){let {cost,...best}=candidates[0];lessons.push(best)}else unplaced.push({subject:r.subject,teacher:r.teacher,duration:r.duration,reason:'未找到同时满足连续空闲、教师窗口、无冲突及每日上限的时段。'})}}return {lessons:lessons.sort((a,b)=>a.day-b.day||a.start-b.start),unplaced}}
function generateSchedule(){let s=activeStudent(),start=$('#weekStart').value,requests=readRequests(),dailyMax=+$('#dailyMax').value,gap=+$('#minGap').value,windowIndex=+$('#teacherWindow').value;if(!start||new Date(start+'T00:00:00Z').getUTCDay()!==1)return toast('请选择周一作为周起始日');if(!requests.length||requests.some(r=>!r.teacher||!Number.isInteger(r.count)||r.count<1||r.count>14))return toast('请填写每门课的教师与1—14的整数课次');if(new Set(requests.map(r=>r.subject)).size!==requests.length)return toast('同一科目请合并为一行');let ranges=[[16,44],[32,44],[36,44],[16,36]],external=state.students.filter(x=>x.id!==s.id).flatMap(x=>x.schedule?.lessons||[]);let result=solveSchedule({requests,availability:s.availability||[],start,dailyMax,gap,windowRange:ranges[windowIndex],external});s.requests=requests;s.dailyMax=dailyMax;s.minGap=gap;s.teacherWindow=windowIndex;s.schedule={start,...result,generated:TODAY};save();$('#scheduleResult').innerHTML=scheduleHTML(s);$('#scheduleResult').scrollIntoView({behavior:'smooth',block:'start'});toast(result.unplaced.length?`已排${result.lessons.length}节，${result.unplaced.length}节需调整时间`:`已排好${result.lessons.length}节课程`)}
function scheduleHTML(s){let a=s.schedule;return `<div class="panel schedule-result" style="margin-top:22px"><div class="section-top"><div><div class="overline">A WEEK OF PROGRESS</div><h2>${esc(s.name)} · 每周学习课表</h2><p class="muted">${a.start} — ${dateAt(a.start,6)} · 北京时间 · 每节课后休息至少${s.minGap??30}分钟</p></div><div class="actions">${button('4K超清 PNG ↓','exportSchedule()','outline')}${button('日历文件 ICS ↓','exportICS()','outline')}</div></div><div class="table-wrap"><table class="week"><thead><tr>${DAYS.map((d,i)=>`<th>${d}<br>${dateAt(a.start,i).slice(5)}</th>`).join('')}</tr></thead><tbody><tr>${DAYS.map((d,i)=>`<td style="vertical-align:top;height:180px">${a.lessons.filter(l=>l.day===i).map((l)=>`<div class="mini-card lesson"><b>${esc(l.subject)}</b>${timeLabel(l.start)}—${timeLabel(l.end)}<br>${l.duration}分钟 · ${esc(l.teacher)}<br><button class="text-btn" style="font-size:10px;margin-top:7px" onclick="removeLesson(${a.lessons.indexOf(l)})">移除</button></div>`).join('')||'<span class="hint">自主复习／休息</span>'}</td>`).join('')}</tr></tbody></table></div>${a.unplaced.length?`<div class="note warm"><b>待协调 ${a.unplaced.length} 节</b><br>${a.unplaced.map(l=>`${esc(l.subject)} / ${esc(l.teacher)} / ${l.duration}分钟：${l.reason}`).join('<br>')}<br>可增加连续空闲时间、调整教师窗口、减少课次，或与其他学员课程错开后重新生成。</div>`:`<div class="note">已排${a.lessons.length}节，满足生成时的已录入约束。发送前请与学生、家长及任课教师确认；修改空闲时间后需重新生成课表。</div>`}<p class="hint">课后安排建议：当日5—10分钟回忆要点，48小时后做新题复测；自习与休息时段未计作正式课程。</p></div>`}
function removeLesson(i){let s=activeStudent(),l=s.schedule.lessons.splice(i,1)[0];s.schedule.unplaced.push({...l,reason:'顾问手动移除，待重新协调。'});save();$('#scheduleResult').innerHTML=scheduleHTML(s);toast('课程已移至待协调')}
function exportICS(){let s=activeStudent();if(!s?.schedule?.lessons.length)return toast('请先生成至少一节课程');function dt(date,t){let d=new Date(date+'T00:00:00Z');d.setUTCMinutes(t*30-480);return d.toISOString().replace(/[-:]/g,'').replace('.000','')}function ical(v){return String(v).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Zhixu//Academic Desk//ZH','CALSCALE:GREGORIAN'];for(let l of s.schedule.lessons)lines.push('BEGIN:VEVENT',`UID:${uid()}@zhixu`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace('.000','')}`,`DTSTART:${dt(l.date,l.start)}`,`DTEND:${dt(l.date,l.end)}`,`SUMMARY:${ical(s.name+' · '+l.subject)}`,`DESCRIPTION:${ical('教师：'+l.teacher+'；时间为北京时间对应时刻')}`,'END:VEVENT');lines.push('END:VCALENDAR');download(new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}),'每周学习课表.ics');toast('日历文件已下载')}

function canvasDoc(title,subtitle,height=2160){const c=document.createElement('canvas');c.width=3840;c.height=height;let x=c.getContext('2d');x.fillStyle='#f4ecdf';x.fillRect(0,0,c.width,c.height);x.fillStyle='#9d563a';x.font='bold 58px "PingFang SC","Microsoft YaHei",sans-serif';x.fillText('伴学一对一  /  ACADEMIC ATELIER',160,140);x.font='32px Georgia,serif';x.textAlign='right';x.fillText('developer Rachel Hu（Shumin）',3680,140);x.textAlign='left';x.fillStyle='#4e4936';x.font='82px "Songti SC",serif';x.fillText(title,160,310);x.font='34px sans-serif';x.fillStyle='#73746b';x.fillText(subtitle,160,390);x.strokeStyle='#c5c7b9';x.lineWidth=2;x.beginPath();x.moveTo(160,450);x.lineTo(3680,450);x.stroke();return {c,x,y:520}}
function wrapCanvas(x,text,maxWidth){let out=[],line='';for(let ch of String(text)){if(ch==='\n'){out.push(line);line='';continue}if(x.measureText(line+ch).width>maxWidth){out.push(line);line=ch}else line+=ch}if(line)out.push(line);return out}
function canvasText(x,text,px,y,width,size=40,line=65,color='#4e4936'){x.font=`${size}px "PingFang SC","Microsoft YaHei",sans-serif`;x.fillStyle=color;let ls=wrapCanvas(x,text,width);for(let s of ls){x.fillText(s,px,y);y+=line}return y}
function canvasFooter(doc){let {x,c}=doc;x.strokeStyle='#c5c7b9';x.beginPath();x.moveTo(160,c.height-160);x.lineTo(3680,c.height-160);x.stroke();x.fillStyle='#73746b';x.font='30px sans-serif';x.fillText('伴学一对一 · 以证据理解学情，以行动陪伴成长。',160,c.height-95);x.textAlign='right';x.fillText('生成日期 '+TODAY+' / 北京时间',3680,c.height-95);x.textAlign='left'}
function saveCanvas(doc,name){canvasFooter(doc);doc.c.toBlob(b=>{if(!b)return toast('导出失败，请重试');download(b,name+'.png');toast(`已导出 ${doc.c.width} × ${doc.c.height} 高清PNG`)},'image/png')}
function exportSchedule(){let s=activeStudent(),a=s?.schedule;if(!a?.lessons.length)return toast('请先生成至少一节课程');let maxDaily=Math.max(...DAYS.map((d,i)=>a.lessons.filter(l=>l.day===i).length));let h=Math.max(2160,900+maxDaily*320),doc=canvasDoc(s.name+' · 每周学习课表',`${a.start} — ${dateAt(a.start,6)}  |  ${s.grade}  |  北京时间  |  已排${a.lessons.length}节${a.unplaced.length?' · 待协调'+a.unplaced.length+'节':''}`,h),{x}=doc,w=3520/7;for(let i=0;i<7;i++){let left=160+i*w;x.fillStyle='#dfe3ed';x.fillRect(left,520,w-8,150);canvasText(x,DAYS[i],left+28,580,w-50,40);canvasText(x,dateAt(a.start,i).slice(5),left+28,635,w-50,30,40,'#73746b');let ls=a.lessons.filter(l=>l.day===i);if(!ls.length)canvasText(x,'自主复习／休息',left+25,760,w-50,30,48,'#73746b');ls.forEach((l,j)=>{let y=710+j*320;x.fillStyle='#fbf7ef';x.fillRect(left,y,w-8,290);canvasText(x,l.subject,left+28,y+65,w-60,48);canvasText(x,`${timeLabel(l.start)}—${timeLabel(l.end)}`,left+28,y+125,w-60,32);canvasText(x,`${l.duration}分钟`,left+28,y+180,w-60,30,40,'#73746b');canvasText(x,`教师 ${l.teacher}`,left+28,y+232,w-60,28,38,'#4e6658')})}canvasText(x,'课后建议：当日回忆要点，48小时后以新题复测。自主复习不计作正式课程。',160,h-350,3520,32,50,'#73746b');canvasText(x,`课表须与教师、家长确认；${a.unplaced.length?'仍有未排课程，请在工作台查看待协调清单。':'已按生成时录入的可用时间与冲突条件编排。'}`,160,h-270,3520,32,50,'#73746b');saveCanvas(doc,'每周学习课表_4K')}
function longReport(title,subtitle,sections,name){let measure=document.createElement('canvas').getContext('2d'),planned=sections.map(sec=>{measure.font='38px sans-serif';let lines=wrapCanvas(measure,sec.body,3300);return {...sec,lines,blockHeight:130+lines.length*62}});let height=Math.max(2160,800+planned.reduce((sum,s)=>sum+s.blockHeight,0));let doc=canvasDoc(title,subtitle,height),y=550;for(let sec of planned){doc.x.fillStyle='#fbf7ef';doc.x.fillRect(160,y-35,3520,sec.blockHeight-20);y=canvasText(doc.x,sec.title,205,y+35,3320,48,68,'#9d563a');y=canvasText(doc.x,sec.body,205,y+15,3300,38,62);y+=70}saveCanvas(doc,name)}
function exportPlan(){let s=activeStudent();if(!s)return;let p=planData(s),secs=[{title:'01 / 学习起点与阶段目标',body:s.scores.map(r=>`${r.subject}：${r.score}/${r.max}，目标${r.target}，目标差距${Math.max(0,r.target-r.score)}分。`).join('\n')+'\n薄弱描述：'+(s.weak||'待补充')},{title:'02 / 最近试卷证据',body:p.latest?`${p.latest.title}：${p.focus.map(t=>t.name+'失'+t.loss+'分').join('；')||'未登记失分'}。`:'未完成逐题诊断，当前只提供复测与学习流程建议。'},...planWeeks(s,p).map((w,i)=>({title:`Week ${i+1} / ${w.title}`,body:w.task+'\n验收：'+w.check})),{title:'方案说明',body:'按录入数据与规则生成，需任课教师确认。目标分为阶段期望，不能保证提分；每周依据新题正确率与独立完成程度调整。'}];longReport(s.name+' · 四周学习方案',`${s.grade} / ${s.province} ${s.city||''} / ${TODAY}`,secs,'四周学习方案_4K')}
function exportAnalysis(id){let s=activeStudent(),a=s?.analyses?.find(p=>p.id===id);if(!a)return;let v=aggregate(a);longReport(s.name+' · 试卷诊断',`${a.title} / ${a.date} / 得分 ${v.score}/${a.total}`,[{title:'01 / 知识点得分',body:v.topics.map(t=>`${t.name}：${t.score}/${t.max}，失${t.loss}分，得分率${Math.round(t.score/t.max*100)}%。`).join('\n')},{title:'02 / 主要错因与行动',body:v.causes.map(c=>`${c.name}：失${c.loss}分。${CAUSE_ACTION[c.name]?.[1]||'补充证据后复测。'}`).join('\n')||'未记录失分，建议用新情境任务检验迁移。'},{title:'03 / 验收与跟进',body:v.causes.map(c=>`${c.name}：${CAUSE_ACTION[c.name]?.[2]}`).join('\n')+'\n本报告由学管录入数据计算，不包含图片自动识别；单次试卷不代表稳定能力。'}],'试卷诊断报告_4K')}
function renderSettings(){$('#view').innerHTML=heading('08 / YOUR WORKSPACE','资料有出处，数据有选择。','当前版本是可独立使用的浏览器工作台；每位销售顾问的数据保存在各自浏览器。')+`<div class="grid two"><div class="panel"><h3>数据保存与备份</h3><p class="muted">会话模式不自动写入本机，刷新或关闭可能丢失内容。开启本机保存后，仅保存在当前浏览器，不跨设备同步，也不向其他学管师显示。</p><label class="checkline"><input type="checkbox" ${state.persist?'checked':''} onchange="setPersist(this.checked)">在这台设备上保存学生档案、诊断与课表</label><div class="actions">${button('导出完整数据 JSON','exportBackup()','outline')}<label class="btn outline file-label">导入备份<input type="file" accept="application/json,.json" hidden onchange="importBackup(this.files[0])"></label></div><p class="hint">试卷图片／PDF预览不进入备份。导入时按学员编号合并，有相同编号的档案会替换。公开分享的是工具，学生信息不会随链接分享。</p><hr class="divider"><button class="text-btn" onclick="askClear()">清空此浏览器的全部工作台数据 →</button></div><div class="panel blue"><h3>当前版本能力边界</h3><ul class="detail-list"><li>34地区选择入口与小学、初中、高中通用复习框架；地区考纲未逐地收齐。</li><li>覆盖文化学科与信息科技、艺术、体育、劳动等课程领域；不是完整教材逐课教案。</li><li>2024—2026公开试卷精选与索引，标明具体试题／目录；未收齐全国近三年全卷。</li><li>试卷文件预览＋手动／表格录入失分；不含OCR、自动判卷或语言模型。</li><li>规则提分方案与排课；本机已知教师课程冲突检测，未连接共享教师日历。</li><li>4K课表PNG、诊断长图、学习方案与ICS日历可下载。</li></ul></div></div><div class="panel" style="margin-top:22px"><div class="micro">SOURCE REGISTER</div><h3>资料依据与核验记录</h3><div class="table-wrap"><table><thead><tr><th>资料</th><th>用途</th><th>状态</th><th>原始来源</th></tr></thead><tbody><tr><td>义务教育课标（2022年版）</td><td>小学、初中知识结构依据</td><td>官方发布</td><td><a target="_blank" rel="noopener" href="${STANDARDS.初中}">教育部 ↗</a></td></tr><tr><td>普通高中课标（2017年版2020年修订）</td><td>高中课程领域参考</td><td>官方发布页</td><td><a target="_blank" rel="noopener" href="${STANDARDS.高中}">教育部 ↗</a></td></tr><tr><td>北京2025年中考问题解答</td><td>展示地区分值差异的核验参考，不套用其他地区</td><td>仅适用对应年份地区</td><td><a target="_blank" rel="noopener" href="https://www.bjeea.cn/html/zkzz/faq/2025/0609/87134.html">北京教育考试院 ↗</a></td></tr><tr><td>公开试题与答案</td><td>原站阅读与试卷诊断</td><td>每条标注来源与收录类型</td><td><button class="text-btn" onclick="go('papers')">查看试卷书架 ↗</button></td></tr></tbody></table></div><p class="hint">最后核验：2026-10-31。知识内容是原创复习提要，非官方全文转载。各地考试设置、计分、教材与政策需按学生对应考试年复核。链接内容由原站维护，可能变化或要求原站权限。</p></div><div class="panel soft" style="margin-top:22px"><h3>给学管师的使用顺序</h3><p class="muted">建立档案 → 录入原始分与目标 → 上传试卷作参考 → 逐题登记满分、得分与错因 → 生成诊断 → 确认四周任务 → 选择真实空闲时段 → 填写教师与课次 → 生成课表并下载4K图片。每周以新题复测更新证据。</p><p class="muted">署名：developer Rachel Hu（Shumin）</p></div>`}

function validStudent(s){return s&&typeof s.id==='string'&&/^[a-f0-9-]{16,64}$/.test(s.id)&&typeof s.name==='string'&&typeof s.code==='string'&&Object.keys(SUBJECTS).includes(s.stage)&&PROVINCES.includes(s.province)&&Array.isArray(s.scores)&&s.scores.every(r=>typeof r.subject==='string'&&[r.score,r.max,r.target].every(Number.isFinite)&&r.max>0&&r.score>=0&&r.score<=r.max&&r.target>=0&&r.target<=r.max)&&(!s.analyses||Array.isArray(s.analyses)&&s.analyses.every(a=>typeof a.id==='string'&&/^[a-f0-9-]{16,64}$/.test(a.id)&&typeof a.title==='string'&&a.total>0&&Number.isFinite(a.total)&&Array.isArray(a.rows)&&a.rows.every(r=>typeof r.topic==='string'&&[r.score,r.max].every(Number.isFinite)&&r.max>0&&r.score>=0&&r.score<=r.max&&CAUSES.includes(r.cause))))&&(!s.schedule||Array.isArray(s.schedule.lessons)&&Array.isArray(s.schedule.unplaced)&&/^\d{4}-\d{2}-\d{2}$/.test(s.schedule.start)&&s.schedule.lessons.every(l=>typeof l.subject==='string'&&typeof l.teacher==='string'&&Number.isInteger(l.day)&&l.day>=0&&l.day<7&&Number.isFinite(l.start)&&Number.isFinite(l.end)&&l.start>=16&&l.end<=44&&l.end>l.start))}
let pendingImport=null;
async function importBackup(file){if(!file)return;if(file.size>10*1024*1024)return toast('备份文件须小于10MB');try{let b=JSON.parse(await file.text());if(b.format!=='zhixu-backup-v1'||!Array.isArray(b.students)||!b.students.every(validStudent)||!Array.isArray(b.papers)||!b.papers.every(p=>safeURL(p.url)&&typeof p.title==='string'&&typeof p.subject==='string'&&typeof p.status==='string'))throw Error();if(new Set(b.students.map(s=>s.code)).size!==b.students.length)throw Error();pendingImport=b;let n=b.students.filter(s=>state.students.some(a=>a.code===s.code)).length;modal('确认导入备份',`<p>包含${b.students.length}个学员、${b.papers.length}条补录资料。${n}个相同编号的现有档案将被替换。</p><div class="actions">${button('确认合并','applyImport()')}${button('取消',"pendingImport=null;$('#modal').close()",'outline')}</div>`)}catch(e){toast('备份格式或字段无效，未修改现有数据')}}
function applyImport(){for(let s of pendingImport.students){let idx=state.students.findIndex(x=>x.code===s.code);let item=structuredClone(s);if(idx>=0){item.id=state.students[idx].id;state.students[idx]=item}else{if(state.students.some(x=>x.id===item.id))item.id=uid();state.students.push(item)}}for(let p of pendingImport.papers)if(!state.papers.some(x=>x.url===p.url))state.papers.push({...p,id:uid(),url:safeURL(p.url),answer:p.answer?safeURL(p.answer):''});state.active=state.students[0]?.id||'';pendingImport=null;save();$('#modal').close();render();toast('备份已合并')}

</script><script>(() => {
